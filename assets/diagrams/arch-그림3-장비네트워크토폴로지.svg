<svg viewBox="0 0 900 480" width="900" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <!-- 장비 zone -->
  <rect x="250" y="18" width="630" height="444" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="266" y="40" fill="#15803d" font-size="13" font-weight="bold">장비 (OT · 차상)</text>

  <!-- External: AWS, DMS -->
  <rect x="40" y="30" width="175" height="52" rx="6" fill="#cffafe" stroke="#06b6d4"/>
  <text x="127" y="52" fill="#0e7490" font-size="12" font-weight="bold" text-anchor="middle">AWS IoT Core</text>
  <text x="127" y="69" fill="#155e75" font-size="9.5" text-anchor="middle">클라우드</text>

  <rect x="40" y="350" width="150" height="52" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="115" y="372" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">DMS 진단툴</text>
  <text x="115" y="389" fill="#7e22ce" font-size="9.5" text-anchor="middle">현장 · 외부</text>

  <!-- Buses -->
  <line x1="345" y1="110" x2="855" y2="110" stroke="#334155" stroke-width="3"/>
  <text x="360" y="102" fill="#334155" font-size="11" font-weight="bold">이더넷</text>
  <line x1="305" y1="345" x2="855" y2="345" stroke="#334155" stroke-width="3"/>
  <text x="320" y="337" fill="#334155" font-size="11" font-weight="bold">CAN (멀티버스 → 단일 버스로 표현)</text>

  <!-- TGU (bridge / cloud boundary) -->
  <rect x="420" y="175" width="118" height="62" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="479" y="197" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">TGU</text>
  <text x="479" y="214" fill="#64748b" font-size="9" text-anchor="middle">경계 · 클라우드 GW</text>
  <text x="479" y="227" fill="#64748b" font-size="9" text-anchor="middle">(이더넷↔CAN 브릿지)</text>
  <line x1="479" y1="175" x2="479" y2="110" stroke="#334155" stroke-width="2"/>
  <line x1="479" y1="237" x2="479" y2="345" stroke="#334155" stroke-width="2"/>

  <!-- 5G: AWS -> TGU -->
  <path d="M 216 66 C 340 90, 380 150, 419 188" stroke="#06b6d4" stroke-width="2" fill="none" marker-end="url(#t-cyan)"/>
  <text x="330" y="120" fill="#0e7490" font-size="10" font-weight="bold">5G</text>

  <!-- SGW (diagnostic boundary) on CAN -->
  <rect x="290" y="380" width="118" height="58" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="349" y="402" fill="#0f766e" font-size="13" font-weight="bold" text-anchor="middle">SGW</text>
  <text x="349" y="419" fill="#64748b" font-size="9" text-anchor="middle">경계 · 진단 GW</text>
  <line x1="349" y1="380" x2="349" y2="345" stroke="#334155" stroke-width="2"/>

  <!-- OBD-II: DMS -> SGW -->
  <path d="M 191 380 C 240 360, 270 372, 300 392" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#t-purple)"/>
  <text x="228" y="352" fill="#6b21a8" font-size="10" font-weight="bold">OBD-II</text>

  <!-- Ethernet controllers -->
  <rect x="556" y="140" width="72" height="40" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="592" y="165" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">SAVM</text>
  <line x1="592" y1="140" x2="592" y2="110" stroke="#334155" stroke-width="1.5"/>
  <rect x="640" y="140" width="72" height="40" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="676" y="165" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">PHM</text>
  <line x1="676" y1="140" x2="676" y2="110" stroke="#334155" stroke-width="1.5"/>
  <rect x="724" y="140" width="72" height="40" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="760" y="165" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">XCU</text>
  <line x1="760" y1="140" x2="760" y2="110" stroke="#334155" stroke-width="1.5"/>
  <rect x="808" y="140" width="60" height="40" rx="4" fill="#ffffff" stroke="#64748b"/>
  <text x="838" y="165" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">GP …</text>
  <line x1="838" y1="140" x2="838" y2="110" stroke="#334155" stroke-width="1.5"/>

  <!-- CAN controllers -->
  <rect x="556" y="378" width="90" height="42" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="601" y="399" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">EPOS</text>
  <text x="601" y="413" fill="#b45309" font-size="9" text-anchor="middle">(HSM)</text>
  <line x1="601" y1="378" x2="601" y2="345" stroke="#334155" stroke-width="1.5"/>
  <rect x="668" y="378" width="90" height="42" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="713" y="399" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">ECU</text>
  <text x="713" y="413" fill="#64748b" font-size="9" text-anchor="middle">(비-HSM)</text>
  <line x1="713" y1="378" x2="713" y2="345" stroke="#334155" stroke-width="1.5"/>
  <text x="790" y="368" fill="#64748b" font-size="10">… 등 모든 제어기</text>

  <!-- Legend -->
  <text x="266" y="452" fill="#64748b" font-size="9.5">굵은 테두리 = 외부 경계(게이트웨이). SGW: 진단(OBD-II/CAN). TGU: 클라우드(5G/이더넷) + 이더넷↔CAN 브릿지.</text>

  <defs>
    <marker id="t-cyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#06b6d4"/></marker>
    <marker id="t-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/></marker>
  </defs>
</svg>
