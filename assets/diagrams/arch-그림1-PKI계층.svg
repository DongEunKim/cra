<svg viewBox="0 0 780 430" width="780" height="430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <!-- Root CA -->
  <rect x="280" y="30" width="200" height="50" rx="8" fill="#1e3a8a"/>
  <text x="380" y="52" fill="white" font-size="14" font-weight="bold" text-anchor="middle">OEM Root CA</text>
  <text x="380" y="70" fill="#bfdbfe" font-size="10" text-anchor="middle">최상위 앵커 · 개인키는 에어갭 오프라인 HSM</text>

  <!-- KMS (isolated) -->
  <rect x="560" y="34" width="190" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="655" y="56" fill="#991b1b" font-size="12" font-weight="bold" text-anchor="middle">🔒 운영 KMS (온라인)</text>
  <text x="655" y="73" fill="#b91c1c" font-size="9" text-anchor="middle">Dev-IC/CS-IC 개인키 ·</text>
  <text x="655" y="86" fill="#b91c1c" font-size="9" text-anchor="middle">FW-Group-Key</text>

  <!-- Intermediate CAs -->
  <rect x="120" y="150" width="220" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="230" y="171" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">Dev-IC (디바이스 CA)</text>
  <text x="230" y="189" fill="#3b82f6" font-size="10" text-anchor="middle">기기·진단툴 신원 인증서 발급</text>

  <rect x="420" y="150" width="220" height="50" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="530" y="171" fill="#1e293b" font-size="13" font-weight="bold" text-anchor="middle">CS-IC (코드서명 CA)</text>
  <text x="530" y="189" fill="#0d9488" font-size="10" text-anchor="middle">펌웨어·배포 서명 서비스</text>

  <!-- Root -> IC (발급) -->
  <path d="M 360 80 L 250 148" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#p-blue)" fill="none"/>
  <path d="M 400 80 L 510 148" stroke="#0d9488" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#p-teal)" fill="none"/>
  <text x="290" y="120" fill="#3b82f6" font-size="10" font-weight="bold" text-anchor="middle">발급</text>
  <text x="470" y="120" fill="#0d9488" font-size="10" font-weight="bold" text-anchor="middle">발급</text>

  <!-- Dev-IC / CS-IC -> KMS (CA만 접근) -->
  <path d="M 340 165 C 620 150, 660 130, 655 102" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#p-red)" fill="none"/>
  <path d="M 640 165 C 680 150, 665 125, 658 102" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#p-red)" fill="none"/>
  <text x="655" y="120" fill="#dc2626" font-size="9.5" font-weight="bold" text-anchor="middle">CA만 접근</text>

  <!-- Issuance targets -->
  <rect x="90" y="270" width="280" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="230" y="290" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">Dev-IC 발급 대상</text>
  <text x="108" y="312" fill="#334155" font-size="10">• 부품 정품 인증서 — TGU · SGW · (ECU)</text>
  <text x="108" y="332" fill="#334155" font-size="10">   (TGU: 로컬 .der / 클라우드 .pem 동일 인증서)</text>
  <text x="108" y="352" fill="#334155" font-size="10">• DMS 라이선스 인증서 (Role OID 포함)</text>
  <text x="108" y="372" fill="#64748b" font-size="9">디바이스 키쌍은 HSM에서 자체 생성(개인키 비반출)</text>

  <rect x="410" y="270" width="280" height="120" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="550" y="290" fill="#0f766e" font-size="11" font-weight="bold" text-anchor="middle">CS-IC 발급 · 서비스</text>
  <text x="428" y="312" fill="#334155" font-size="10">• 펌웨어 서명 (개발자·벤더 키 없음)</text>
  <text x="428" y="332" fill="#334155" font-size="10">• 배포 서명 서비스 — 배포 시스템 요청 시</text>
  <text x="428" y="352" fill="#334155" font-size="10">   개인키는 KMS에 상주(배포 시스템 미보유)</text>
  <text x="428" y="372" fill="#64748b" font-size="9">FW-Group-Key 랩핑도 KMS 연산으로 수행</text>

  <path d="M 230 200 L 230 268" stroke="#3b82f6" stroke-width="2" marker-end="url(#p-blue)"/>
  <path d="M 530 200 L 550 268" stroke="#0d9488" stroke-width="2" marker-end="url(#p-teal)"/>

  <defs>
    <marker id="p-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="p-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker>
    <marker id="p-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
  </defs>
</svg>
