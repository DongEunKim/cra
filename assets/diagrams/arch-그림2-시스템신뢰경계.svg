<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <!-- ===== Zones (top row) ===== -->
  <rect x="20" y="48" width="250" height="300" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="32" y="68" fill="#334155" font-size="12" font-weight="bold">OEM 백엔드 (격리)</text>

  <rect x="285" y="48" width="320" height="300" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="297" y="68" fill="#0e7490" font-size="12" font-weight="bold">OEM 클라우드</text>

  <rect x="620" y="48" width="320" height="300" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="632" y="68" fill="#15803d" font-size="12" font-weight="bold">장비 (OT · 차상)</text>

  <!-- ===== Zones (bottom row) ===== -->
  <rect x="20" y="368" width="290" height="205" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="32" y="388" fill="#475569" font-size="12" font-weight="bold">부품사 공정 (Tier-1 생산)</text>

  <rect x="325" y="368" width="290" height="205" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="337" y="388" fill="#475569" font-size="12" font-weight="bold">완성차 공정 (EOL 조립)</text>

  <rect x="630" y="368" width="310" height="205" rx="8" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="642" y="388" fill="#6b21a8" font-size="12" font-weight="bold">현장</text>

  <!-- ===== OEM 백엔드 (격리) ===== -->
  <rect x="35" y="78" width="220" height="116" rx="6" fill="#ffffff" stroke="#1e3a8a"/>
  <text x="43" y="94" fill="#1e3a8a" font-size="11" font-weight="bold">CA 계층</text>
  <rect x="72" y="99" width="145" height="26" rx="4" fill="#1e3a8a"/>
  <text x="144" y="116" fill="white" font-size="10" font-weight="bold" text-anchor="middle">Root CA (오프라인)</text>
  <rect x="45" y="135" width="95" height="34" rx="4" fill="#ffffff" stroke="#3b82f6"/>
  <text x="92" y="151" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="middle">Dev-IC</text>
  <text x="92" y="163" fill="#64748b" font-size="8" text-anchor="middle">디바이스 CA</text>
  <rect x="150" y="135" width="95" height="34" rx="4" fill="#ffffff" stroke="#0d9488"/>
  <text x="197" y="151" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="middle">CS-IC</text>
  <text x="197" y="163" fill="#64748b" font-size="8" text-anchor="middle">코드서명 CA</text>

  <rect x="45" y="210" width="200" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="145" y="230" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">🔒 KMS (격리)</text>
  <text x="145" y="246" fill="#b91c1c" font-size="9" text-anchor="middle">CA 개인키 · FW-Group-Key</text>

  <!-- ===== OEM 클라우드 ===== -->
  <rect x="300" y="78" width="290" height="58" rx="6" fill="#cffafe" stroke="#06b6d4"/>
  <text x="445" y="98" fill="#0e7490" font-size="12" font-weight="bold" text-anchor="middle">AWS IoT Core — 연결점</text>
  <text x="445" y="115" fill="#155e75" font-size="9.5" text-anchor="middle">mTLS·JITP 연결만 (캠페인 안 함)</text>

  <rect x="300" y="152" width="290" height="60" rx="6" fill="#eef2ff" stroke="#6366f1"/>
  <text x="445" y="171" fill="#3730a3" font-size="11.5" font-weight="bold" text-anchor="middle">배포 시스템 (자체 OTA Platform)</text>
  <text x="445" y="187" fill="#4338ca" font-size="9" text-anchor="middle">패키징·아티팩트·캠페인</text>
  <text x="445" y="201" fill="#4338ca" font-size="9" text-anchor="middle">→ eSync 전환 계획</text>

  <rect x="300" y="228" width="290" height="52" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-dasharray="5,4"/>
  <text x="445" y="248" fill="#6b21a8" font-size="11.5" font-weight="bold" text-anchor="middle">VLM (차량 레지스트리)</text>
  <text x="445" y="264" fill="#7e22ce" font-size="9" text-anchor="middle">식별자↔VIN 매핑 · SBOM 이력</text>
  <text x="445" y="300" fill="#94a3b8" font-size="8.5" text-anchor="middle">점선 = 미도입(추상)</text>

  <!-- ===== 장비 (OT) ===== -->
  <rect x="635" y="80" width="140" height="58" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="705" y="99" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">TGU</text>
  <text x="705" y="114" fill="#64748b" font-size="8.5" text-anchor="middle">인스톨러+텔레매틱스</text>
  <text x="705" y="127" fill="#0284c7" font-size="8.5" font-weight="bold" text-anchor="middle">유일 클라우드 출구</text>
  <rect x="785" y="80" width="140" height="58" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="855" y="99" fill="#0f766e" font-size="12" font-weight="bold" text-anchor="middle">SGW</text>
  <text x="855" y="116" fill="#64748b" font-size="8.5" text-anchor="middle">경계·오프라인 검증</text>

  <rect x="635" y="152" width="140" height="52" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="705" y="171" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">제어기 (HSM)</text>
  <text x="705" y="186" fill="#b45309" font-size="8.5" text-anchor="middle">예: EPOS · FOTA 대상</text>
  <rect x="785" y="152" width="140" height="52" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="855" y="171" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">제어기 (비-HSM)</text>
  <text x="855" y="186" fill="#64748b" font-size="8.5" text-anchor="middle">하위 ECU</text>

  <text x="635" y="228" fill="#64748b" font-size="9">TGU·SGW 포함 모두 ECU(제어기).</text>
  <text x="635" y="242" fill="#64748b" font-size="9">HSM 보유 여부로 구분하며, 'FOTA 대상'은 역할이다.</text>

  <!-- ===== 부품사 공정 ===== -->
  <text x="35" y="412" fill="#334155" font-size="10">• 제어기 키쌍 자체 생성 · CSR</text>
  <text x="35" y="432" fill="#334155" font-size="10">• 부품 정품 인증서 발급·주입 (Dev-IC)</text>
  <text x="35" y="452" fill="#334155" font-size="10">• Factory Flashing (초기 FW·Root 앵커)</text>
  <text x="35" y="472" fill="#64748b" font-size="9">HSM 제어기: FW-Group-Key도 주입</text>

  <!-- ===== 완성차 공정 (EOL) ===== -->
  <text x="340" y="412" fill="#334155" font-size="10">• 제어기 시리얼 스캔 → 식별자↔VIN 매핑</text>
  <text x="340" y="432" fill="#334155" font-size="10">• SGW에 발급 CA 공개키 · 문자열 VIN 주입</text>
  <text x="340" y="452" fill="#334155" font-size="10">• 3rd Party ECU 식별자 등록(→ VLM)</text>
  <text x="340" y="472" fill="#64748b" font-size="9">부품→하나의 장비(VIN)로 결합</text>

  <!-- ===== 현장 (DMS) ===== -->
  <rect x="650" y="404" width="270" height="60" rx="6" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="785" y="428" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">DMS 진단툴</text>
  <text x="785" y="446" fill="#7e22ce" font-size="9.5" text-anchor="middle">UDS 0x29 · Role 인증 (오프라인)</text>

  <!-- ===== Arrows ===== -->
  <!-- 1 CA -> KMS -->
  <path d="M 145 194 L 145 208" stroke="#dc2626" stroke-width="2" marker-end="url(#s-red)"/>
  <circle cx="165" cy="201" r="8" fill="#dc2626"/><text x="165" y="205" fill="white" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <!-- 2 Dev-IC -> AWS (JITP CA 등록) -->
  <path d="M 140 150 C 220 120, 250 108, 298 107" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#s-blue)"/>
  <circle cx="250" cy="120" r="8" fill="#3b82f6"/><text x="250" y="124" fill="white" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <!-- 3 배포시스템 -> CS-IC (배포서명 요청) -->
  <path d="M 300 172 C 268 168, 250 166, 246 170" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#s-indigo)"/>
  <circle cx="280" cy="158" r="8" fill="#6366f1"/><text x="280" y="162" fill="white" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <!-- 4 TGU <-> AWS (mTLS) -->
  <path d="M 633 102 L 592 102" stroke="#0ea5e9" stroke-width="2" marker-end="url(#s-sky)"/>
  <path d="M 592 116 L 633 116" stroke="#0ea5e9" stroke-width="2" marker-end="url(#s-sky)"/>
  <circle cx="612" cy="92" r="8" fill="#0ea5e9"/><text x="612" y="96" fill="white" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <!-- 5 배포시스템 -> AWS (FW 캠페인 잡) -->
  <path d="M 400 152 L 400 138" stroke="#6366f1" stroke-width="2" marker-end="url(#s-indigo)"/>
  <circle cx="380" cy="145" r="8" fill="#6366f1"/><text x="380" y="149" fill="white" font-size="10" font-weight="bold" text-anchor="middle">5</text>
  <!-- 6 AWS -> VLM (JITP VIN 질의) -->
  <path d="M 320 136 C 296 170, 296 210, 320 230" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#s-cyan)"/>
  <circle cx="299" cy="185" r="8" fill="#0891b2"/><text x="299" y="189" fill="white" font-size="10" font-weight="bold" text-anchor="middle">6</text>

  <!-- Legend -->
  <rect x="325" y="480" width="290" height="86" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="337" y="498" fill="#0f172a" font-size="10" font-weight="bold">범례</text>
  <text x="337" y="514" fill="#334155" font-size="9">① CA만 KMS 접근  ② Dev-IC 인증서 등록(JITP)</text>
  <text x="337" y="529" fill="#334155" font-size="9">③ 배포서명 요청→CS-IC  ④ mTLS 연결(연결점)</text>
  <text x="337" y="544" fill="#334155" font-size="9">⑤ FW 캠페인 잡(배포 시스템 발원)  ⑥ JITP VIN 질의</text>
  <text x="337" y="559" fill="#64748b" font-size="8.5">캠페인=배포 시스템, 연결=AWS IoT Core. TGU만 IT↔클라우드.</text>

  <defs>
    <marker id="s-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="s-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="s-indigo" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/></marker>
    <marker id="s-sky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="s-cyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0891b2"/></marker>
  </defs>
</svg>
