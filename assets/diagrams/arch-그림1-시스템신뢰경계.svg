<svg viewBox="0 0 920 500" width="920" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <!-- Zones -->
  <rect x="20" y="45" width="350" height="400" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="34" y="65" fill="#1e3a8a" font-size="12" font-weight="bold">OEM 백엔드 (IT)</text>

  <rect x="390" y="45" width="210" height="130" rx="8" fill="#ecfeff" stroke="#a5f3fc"/>
  <text x="404" y="65" fill="#0e7490" font-size="12" font-weight="bold">클라우드</text>

  <rect x="390" y="190" width="210" height="255" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="404" y="210" fill="#475569" font-size="12" font-weight="bold">공정 / 현장</text>

  <rect x="620" y="45" width="280" height="300" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="634" y="65" fill="#15803d" font-size="12" font-weight="bold">장비 (OT · 차상)</text>

  <!-- OEM components -->
  <rect x="40" y="75" width="310" height="54" rx="6" fill="#eef2ff" stroke="#818cf8"/>
  <text x="195" y="96" fill="#3730a3" font-size="12" font-weight="bold" text-anchor="middle">배포 시스템 (Distribution)</text>
  <text x="195" y="114" fill="#4338ca" font-size="10" text-anchor="middle">패키징·아티팩트·캠페인 (eSync 호환)</text>

  <rect x="40" y="148" width="310" height="112" rx="6" fill="#ffffff" stroke="#1e3a8a"/>
  <text x="48" y="164" fill="#1e3a8a" font-size="11" font-weight="bold">CA 계층</text>
  <rect x="110" y="168" width="170" height="28" rx="4" fill="#1e3a8a"/>
  <text x="195" y="186" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Root CA (오프라인)</text>
  <rect x="50" y="212" width="140" height="38" rx="4" fill="#ffffff" stroke="#3b82f6"/>
  <text x="120" y="230" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="middle">Dev-IC</text>
  <text x="120" y="243" fill="#64748b" font-size="9" text-anchor="middle">디바이스 CA</text>
  <rect x="200" y="212" width="140" height="38" rx="4" fill="#ffffff" stroke="#0d9488"/>
  <text x="270" y="230" fill="#1e293b" font-size="11" font-weight="bold" text-anchor="middle">CS-IC</text>
  <text x="270" y="243" fill="#64748b" font-size="9" text-anchor="middle">코드서명 CA</text>

  <rect x="60" y="288" width="270" height="52" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="195" y="308" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">🔒 KMS · 유일 키관리 (격리)</text>
  <text x="195" y="324" fill="#b91c1c" font-size="9.5" text-anchor="middle">모든 CA 개인키 · SW-Group-Key 보관</text>

  <rect x="40" y="360" width="310" height="46" rx="6" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="195" y="380" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">VLM (개념적 추상)</text>
  <text x="195" y="396" fill="#7e22ce" font-size="9.5" text-anchor="middle">식별자↔VIN 매핑 · SBOM 이력</text>

  <!-- Cloud -->
  <rect x="405" y="72" width="180" height="88" rx="6" fill="#cffafe" stroke="#06b6d4"/>
  <text x="495" y="92" fill="#0e7490" font-size="12" font-weight="bold" text-anchor="middle">AWS IoT Core</text>
  <text x="495" y="110" fill="#155e75" font-size="10" text-anchor="middle">mTLS · JITP 프로비저닝</text>
  <text x="495" y="128" fill="#155e75" font-size="9" text-anchor="middle">(Dev-IC 아님 — 신뢰 CA로</text>
  <text x="495" y="141" fill="#155e75" font-size="9" text-anchor="middle">Dev-IC/Root 등록, 발급 안 함)</text>

  <!-- 공정 / 현장 -->
  <rect x="405" y="222" width="180" height="48" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="495" y="242" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">공정 (부품사·EOL)</text>
  <text x="495" y="258" fill="#64748b" font-size="9.5" text-anchor="middle">MES · 테스터</text>
  <rect x="405" y="286" width="180" height="48" rx="6" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="495" y="306" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">현장 · DMS 진단툴</text>
  <text x="495" y="322" fill="#7e22ce" font-size="9.5" text-anchor="middle">UDS 0x29</text>

  <!-- 장비 OT -->
  <rect x="645" y="80" width="115" height="58" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="702" y="100" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">TGU</text>
  <text x="702" y="115" fill="#64748b" font-size="8.5" text-anchor="middle">인스톨러+텔레매틱스</text>
  <text x="702" y="128" fill="#0284c7" font-size="8.5" font-weight="bold" text-anchor="middle">유일 클라우드 출구</text>
  <rect x="775" y="80" width="110" height="58" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="830" y="100" fill="#0f766e" font-size="12" font-weight="bold" text-anchor="middle">SGW</text>
  <text x="830" y="116" fill="#64748b" font-size="8.5" text-anchor="middle">경계·오프라인 검증</text>
  <rect x="645" y="160" width="115" height="48" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="702" y="180" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">타겟 제어기</text>
  <text x="702" y="196" fill="#b45309" font-size="9.5" text-anchor="middle">(HSM)</text>
  <rect x="775" y="160" width="110" height="48" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="830" y="180" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">ECU</text>
  <text x="830" y="196" fill="#64748b" font-size="9.5" text-anchor="middle">(No HSM)</text>

  <!-- Arrows -->
  <!-- (1) CA -> KMS -->
  <path d="M 195 260 L 195 286" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
  <circle cx="215" cy="274" r="8" fill="#dc2626"/><text x="215" y="278" fill="white" font-size="10" font-weight="bold" text-anchor="middle">1</text>
  <!-- (2) 배포시스템 -> CS-IC -->
  <path d="M 300 129 L 285 210" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/>
  <circle cx="308" cy="170" r="8" fill="#6366f1"/><text x="308" y="174" fill="white" font-size="10" font-weight="bold" text-anchor="middle">2</text>
  <!-- (3) TGU <-> AWS -->
  <path d="M 645 108 L 587 108" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/>
  <path d="M 587 122 L 645 122" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-sky)"/>
  <circle cx="616" cy="98" r="8" fill="#0ea5e9"/><text x="616" y="102" fill="white" font-size="10" font-weight="bold" text-anchor="middle">3</text>
  <!-- (4) 배포시스템 -> AWS (FW 캠페인) -->
  <path d="M 350 100 L 403 100" stroke="#6366f1" stroke-width="2" marker-end="url(#a-indigo)"/>
  <circle cx="377" cy="90" r="8" fill="#6366f1"/><text x="377" y="94" fill="white" font-size="10" font-weight="bold" text-anchor="middle">4</text>
  <!-- (5) AWS -> VLM (JITP 질의) -->
  <path d="M 408 150 C 385 250, 385 320, 352 372" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#a-cyan)"/>
  <circle cx="384" cy="250" r="8" fill="#0891b2"/><text x="384" y="254" fill="white" font-size="10" font-weight="bold" text-anchor="middle">5</text>

  <!-- Legend -->
  <rect x="620" y="360" width="280" height="85" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="632" y="378" fill="#0f172a" font-size="10" font-weight="bold">범례</text>
  <text x="632" y="394" fill="#334155" font-size="9.5">① CA만 KMS 접근 (키 격리)  ② 배포서명 요청→CS-IC</text>
  <text x="632" y="409" fill="#334155" font-size="9.5">③ mTLS·JITP (유일 출구)  ④ FW 캠페인 배포</text>
  <text x="632" y="424" fill="#334155" font-size="9.5">⑤ JITP VIN 질의 (AWS→VLM)</text>
  <text x="632" y="439" fill="#64748b" font-size="8.5">굵은 테두리 존 = 신뢰 경계. TGU만 IT↔클라우드 브릿지.</text>

  <defs>
    <marker id="a-red" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/></marker>
    <marker id="a-indigo" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/></marker>
    <marker id="a-sky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="a-cyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0891b2"/></marker>
  </defs>
</svg>
