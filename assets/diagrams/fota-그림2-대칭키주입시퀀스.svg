<svg viewBox="0 0 800 440" width="800" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect x="20" y="20" width="360" height="400" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="200" y="40" fill="#64748b" font-weight="bold" font-size="12" text-anchor="middle">부품사 (Tier 1) 영역</text>
  <rect x="400" y="20" width="380" height="400" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="590" y="40" fill="#3b82f6" font-weight="bold" font-size="12" text-anchor="middle">OEM 클라우드 영역</text>

  <rect x="40" y="60" width="120" height="40" rx="6" fill="#f59e0b" />
  <text x="100" y="85" fill="white" font-weight="bold" text-anchor="middle">제어기 (HSM)</text>
  <line x1="100" y1="100" x2="100" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <rect x="220" y="60" width="120" height="40" rx="6" fill="#64748b" />
  <text x="280" y="85" fill="white" font-weight="bold" text-anchor="middle">Tier-1 테스터</text>
  <line x1="280" y1="100" x2="280" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <rect x="440" y="60" width="120" height="40" rx="6" fill="#3b82f6" />
  <text x="500" y="85" fill="white" font-weight="bold" text-anchor="middle">Dev-IC (인증기관)</text>
  <line x1="500" y1="100" x2="500" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <rect x="630" y="60" width="120" height="40" rx="6" fill="#0f766e" />
  <text x="690" y="85" fill="white" font-weight="bold" text-anchor="middle">OEM KMS</text>
  <line x1="690" y1="100" x2="690" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Steps -->
  <rect x="30" y="110" width="140" height="40" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="100" y="126" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">고유 키쌍(Dev) 생성</text>
  <text x="100" y="140" fill="#92400e" font-size="10" text-anchor="middle">CSR(인증서 서명 요청) 생성</text>

  <path d="M 160 160 L 270 160" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="215" y="150" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">1. CSR 전달</text>

  <path d="M 290 180 L 490 180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue2)"/>
  <text x="390" y="170" fill="#3b82f6" font-size="11" font-weight="bold" text-anchor="middle">2. CSR 전송 (인터넷/VPN)</text>

  <path d="M 510 200 L 680 200" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="595" y="190" fill="#0f766e" font-size="11" font-weight="bold" text-anchor="middle">3. FW-Group-Key 발급 요청</text>

  <rect x="580" y="215" width="220" height="45" rx="4" fill="#ccfbf1" stroke="#2dd4bf"/>
  <text x="690" y="232" fill="#115e59" font-size="11" font-weight="bold" text-anchor="middle">KMS 랩핑 연산 (비대칭 → 대칭)</text>
  <text x="690" y="247" fill="#115e59" font-size="10" text-anchor="middle">대칭키를 CSR 안의 Dev-Pub으로 암호화</text>

  <path d="M 680 280 L 510 280" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow-teal-rev)"/>
  <text x="595" y="270" fill="#0f766e" font-size="11" font-weight="bold" text-anchor="middle">4. 랩핑된 대칭키 반환</text>

  <rect x="410" y="295" width="180" height="45" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="500" y="312" fill="#1e40af" font-size="11" font-weight="bold" text-anchor="middle">인증서 내 확장 필드(Ext) 삽입</text>
  <text x="500" y="327" fill="#1e40af" font-size="10" text-anchor="middle">랩핑된 대칭키를 인증서에 매립하여 서명</text>

  <path d="M 490 355 L 290 355" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue-rev)"/>
  <text x="390" y="345" fill="#3b82f6" font-size="11" font-weight="bold" text-anchor="middle">5. 디바이스 인증서(.der) 발급</text>

  <path d="M 270 375 L 110 375" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray-rev)"/>
  <text x="190" y="365" fill="#475569" font-size="11" font-weight="bold" text-anchor="middle">6. 인증서 주입</text>

  <rect x="30" y="390" width="140" height="40" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="100" y="406" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">자체 파싱 및 복호화</text>
  <text x="100" y="420" fill="#92400e" font-size="10" text-anchor="middle">인증서 Ext에서 대칭키 추출/저장</text>

  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#475569" /></marker>
    <marker id="arrow-gray-rev" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#475569" /></marker>
    <marker id="arrow-blue2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6" /></marker>
    <marker id="arrow-blue-rev" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6" /></marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e" /></marker>
    <marker id="arrow-teal-rev" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0f766e" /></marker>
  </defs>
</svg>
