<svg viewBox="0 0 800 280" width="800" height="280" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect x="300" y="20" width="200" height="60" rx="8" fill="#1e3a8a" />
  <text x="400" y="50" fill="white" font-size="15" font-weight="bold" text-anchor="middle">디바이스 CA (Dev-IC)</text>
  <text x="400" y="68" fill="#bfdbfe" font-size="10" text-anchor="middle">구 '통합 디바이스 CA'</text>
  <path d="M 400 80 L 200 150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow1)" fill="none" stroke-dasharray="5,5"/>
  <path d="M 400 80 L 400 150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow1)" fill="none" stroke-dasharray="5,5"/>
  <path d="M 400 80 L 600 150" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow1)" fill="none" stroke-dasharray="5,5"/>

  <rect x="100" y="150" width="200" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="200" y="180" fill="#1e293b" font-size="15" font-weight="bold" text-anchor="middle">TGU (텔레매틱스)</text>
  <text x="200" y="205" fill="#64748b" font-size="12" text-anchor="middle">부품 정품 인증서 (.pem)</text>
  <text x="200" y="225" fill="#3b82f6" font-size="12" font-weight="bold" text-anchor="middle">AWS mTLS 접속용</text>

  <rect x="320" y="150" width="160" height="90" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <text x="400" y="180" fill="#1e293b" font-size="15" font-weight="bold" text-anchor="middle">SGW (방화벽)</text>
  <text x="400" y="205" fill="#64748b" font-size="12" text-anchor="middle">부품 정품 인증서 (.der)</text>
  <text x="400" y="225" fill="#0d9488" font-size="12" font-weight="bold" text-anchor="middle">오프라인 신분 증명</text>

