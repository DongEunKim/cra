<svg viewBox="0 0 800 480" width="800" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect x="50" y="20" width="140" height="40" rx="6" fill="#1e3a8a" />
  <text x="120" y="45" fill="white" font-weight="bold" text-anchor="middle">배포 서버</text>
  <line x1="120" y1="60" x2="120" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <rect x="330" y="20" width="140" height="40" rx="6" fill="#0ea5e9" />
  <text x="400" y="45" fill="white" font-weight="bold" text-anchor="middle">인스톨러 (TGU)</text>
  <line x1="400" y1="60" x2="400" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <rect x="610" y="20" width="140" height="40" rx="6" fill="#f59e0b" />
  <text x="680" y="45" fill="white" font-weight="bold" text-anchor="middle">타겟 제어기 (HSM)</text>
  <line x1="680" y1="60" x2="680" y2="460" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Phase 1 -->
  <rect x="30" y="80" width="740" height="150" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" rx="4"/>
  <text x="40" y="100" fill="#475569" font-size="12" font-weight="bold">1단계: 배포 패키지 검증 (Outer)</text>
  <path d="M 120 120 L 390 120" stroke="#1e3a8a" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="260" y="110" fill="#1e3a8a" font-size="11" font-weight="bold" text-anchor="middle">FW 업데이트 패키지 전송</text>

  <rect x="420" y="130" width="220" height="80" rx="4" fill="#e0f2fe" stroke="#38bdf8"/>
  <text x="430" y="145" fill="#0369a1" font-size="11" font-weight="bold">TGU 로컬 검증</text>
  <text x="430" y="160" fill="#0369a1" font-size="10">1. 내장 Root CA로 CS-IC 인증서 검증</text>
  <text x="430" y="175" fill="#0369a1" font-size="10">2. CS-IC 공개키로 배포 서명 검증</text>
  <text x="430" y="190" fill="#0369a1" font-size="10">3. Target HW ID 호환성 확인</text>
  <text x="430" y="205" fill="#0369a1" font-size="10">4. Outer 봉투 제거</text>

  <!-- Phase 2 -->
  <rect x="30" y="250" width="740" height="200" fill="#fffbeb" stroke="#fde68a" stroke-width="1" rx="4"/>
  <text x="40" y="270" fill="#92400e" font-size="12" font-weight="bold">2단계: 설치 패키지 (펌웨어) 검증 (Inner)</text>
  <path d="M 400 290 L 670 290" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="535" y="280" fill="#d97706" font-size="11" font-weight="bold" text-anchor="middle">설치 패키지 (알맹이) 전송</text>

  <rect x="450" y="310" width="240" height="110" rx="4" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="460" y="325" fill="#92400e" font-size="11" font-weight="bold">제어기 로컬 검증 (HSM)</text>
  <text x="460" y="340" fill="#92400e" font-size="10">1. TSK 획득 및 펌웨어 복호화 (Type B)</text>
  <text x="460" y="355" fill="#92400e" font-size="10">2. Root CA 또는 CS-IC 공개키로</text>
  <text x="460" y="370" fill="#92400e" font-size="10">   SW 개발자 인증서 체인 검증</text>
  <text x="460" y="385" fill="#92400e" font-size="10">3. SW 개발자 공개키로 펌웨어 서명 검증</text>
  <text x="460" y="400" fill="#92400e" font-size="10">4. 롤백 방지 확인 후 플래시에 기록</text>

  <path d="M 680 430 L 400 430" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="540" y="420" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">설치 완료 및 리부팅 응답</text>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#1e3a8a" /></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" /></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e" /></marker>
  </defs>
</svg>
