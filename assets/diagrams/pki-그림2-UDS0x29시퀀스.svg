<svg viewBox="0 0 800 320" width="800" height="320" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <rect x="100" y="20" width="120" height="40" rx="4" fill="#9333ea" />
  <text x="160" y="45" fill="white" font-weight="bold" text-anchor="middle">DMS (진단툴)</text>
  <line x1="160" y1="60" x2="160" y2="300" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="2"/>

  <rect x="580" y="20" width="120" height="40" rx="4" fill="#0d9488" />
  <text x="640" y="45" fill="white" font-weight="bold" text-anchor="middle">SGW (게이트웨이)</text>
  <line x1="640" y1="60" x2="640" y2="300" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="2"/>

  <text x="400" y="90" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">1. UDS 0x29 01 (인증 요청)</text>
  <path d="M 170 95 L 630 95" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="400" y="130" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">2. UDS 0x69 01 + Challenge (16B 난수)</text>
  <path d="M 630 135 L 170 135" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="40" y="150" width="240" height="40" rx="4" fill="#f3e8ff" stroke="#d8b4fe"/>
  <text x="160" y="166" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">3. DMS 내부 연산</text>
  <text x="160" y="182" fill="#6b21a8" font-size="11" text-anchor="middle">개인키로 Challenge 서명 (64B)</text>

  <text x="400" y="215" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">4. UDS 0x29 02 + 인증서(.der) + 서명값(64B)</text>
  <path d="M 170 220 L 630 220" stroke="#334155" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="520" y="235" width="240" height="50" rx="4" fill="#ccfbf1" stroke="#5eead4"/>
  <text x="640" y="250" fill="#0f766e" font-size="11" font-weight="bold" text-anchor="middle">5. SGW 로컬 보안 검증</text>
  <text x="640" y="266" fill="#0f766e" font-size="11" text-anchor="middle">Root키로 인증서 검증 및 서명 확인</text>
  <text x="640" y="280" fill="#0f766e" font-size="11" text-anchor="middle">Role OID 파싱하여 권한 판단</text>

  <text x="400" y="305" fill="#059669" font-size="12" font-weight="bold" text-anchor="middle">6. UDS 0x69 02 (세션 개방 및 권한 부여)</text>
  <path d="M 630 310 L 170 310" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#334155" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#059669" />
    </marker>
  </defs>
</svg>
