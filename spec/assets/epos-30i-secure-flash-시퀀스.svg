<svg viewBox="0 0 960 792" width="960" height="792" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- 액터 -->
  <rect x="70" y="24" width="160" height="44" rx="6" fill="#0ea5e9"/>
  <text x="150" y="51" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">TGU / 진단기</text>
  <rect x="380" y="24" width="200" height="44" rx="6" fill="#1e3a8a"/>
  <text x="480" y="51" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EPOS-30i Host (UDS)</text>
  <rect x="700" y="24" width="220" height="44" rx="6" fill="#f59e0b"/>
  <text x="810" y="51" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">EPOS-30i HSM Core</text>

  <line x1="150" y1="68" x2="150" y2="770" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="480" y1="68" x2="480" y2="770" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="810" y1="68" x2="810" y2="770" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>

  <!-- Phase 0 밴드 -->
  <rect x="30" y="84" width="900" height="22" rx="4" fill="#e2e8f0"/>
  <text x="40" y="100" fill="#334155" font-size="11" font-weight="bold">Phase 0 · Secure Access (UDS 0x29, 단방향)</text>

  <text x="315" y="126" fill="#334155" font-size="10.5" text-anchor="middle">1. 0x29 0x01 verifyCertUnidirectional (certClient + challenge)</text>
  <path d="M 152 132 L 478 132" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>

  <text x="645" y="150" fill="#334155" font-size="10" text-anchor="middle">2. 인증서 검증 요청</text>
  <path d="M 482 156 L 808 156" stroke="#334155" stroke-width="1.6" marker-end="url(#s-ar)"/>
  <rect x="675" y="164" width="270" height="46" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="184" fill="#b45309" font-size="9.5" text-anchor="middle">SA_ROOT_CA_PUB로 ECDSA P-256 검증</text>
  <text x="810" y="200" fill="#64748b" font-size="9.5" text-anchor="middle">challengeServer(TRNG 32B) 생성</text>

  <text x="315" y="234" fill="#334155" font-size="10.5" text-anchor="middle">3. 0x69 0x01 + challengeServer[32B]</text>
  <path d="M 478 240 L 152 240" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>

  <text x="315" y="266" fill="#334155" font-size="10.5" text-anchor="middle">4. 0x29 0x03 proofOfOwnership = ECDSA_Sign(challenge)</text>
  <path d="M 152 272 L 478 272" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>

  <rect x="675" y="286" width="270" height="44" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="810" y="306" fill="#166534" font-size="9.5" text-anchor="middle">5. 서명 검증 → Authenticated</text>
  <text x="810" y="322" fill="#64748b" font-size="9.5" text-anchor="middle">EVT_SA_SUCCESS</text>
  <path d="M 482 300 L 673 300" stroke="#334155" stroke-width="1.6" marker-end="url(#s-ar)"/>

  <text x="315" y="352" fill="#166534" font-size="10.5" text-anchor="middle">6. 0x69 0x03 인증 완료</text>
  <path d="M 478 358 L 152 358" stroke="#22c55e" stroke-width="1.8" marker-end="url(#s-ar-green)"/>

  <!-- Secure Flash 밴드 -->
  <rect x="30" y="374" width="900" height="22" rx="4" fill="#e2e8f0"/>
  <text x="40" y="390" fill="#334155" font-size="11" font-weight="bold">Secure Flash (UDS 0x34 / 0x36 / 0x37) — 미인증 시 NRC 0x33</text>

  <text x="315" y="416" fill="#334155" font-size="10.5" text-anchor="middle">7. 0x34 RequestDownload (대상 = 비활성 뱅크)</text>
  <path d="M 152 422 L 478 422" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>

  <text x="315" y="448" fill="#334155" font-size="10.5" text-anchor="middle">8. 0x36 TransferData (SE Binary 청크)</text>
  <path d="M 152 454 L 478 454" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>
  <rect x="675" y="466" width="270" height="44" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="486" fill="#b45309" font-size="9.5" text-anchor="middle">AES-128-CTR 복호화(CEK 재파생)</text>
  <text x="810" y="502" fill="#64748b" font-size="9.5" text-anchor="middle">Body 진위 누적 계산</text>
  <path d="M 482 480 L 673 480" stroke="#334155" stroke-width="1.6" marker-end="url(#s-ar)"/>

  <text x="315" y="534" fill="#334155" font-size="10.5" text-anchor="middle">9. 0x37 RequestTransferExit</text>
  <path d="M 152 540 L 478 540" stroke="#334155" stroke-width="1.8" marker-end="url(#s-ar)"/>
  <rect x="675" y="552" width="270" height="44" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="810" y="572" fill="#b45309" font-size="9.5" text-anchor="middle">ECDSA(P-256) 진위검증</text>
  <text x="810" y="588" fill="#64748b" font-size="9.5" text-anchor="middle">안티롤백(FW Version) 확인</text>
  <path d="M 482 566 L 673 566" stroke="#334155" stroke-width="1.6" marker-end="url(#s-ar)"/>

  <rect x="675" y="606" width="270" height="44" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="810" y="626" fill="#334155" font-size="9.5" text-anchor="middle">비활성 뱅크 기록</text>
  <text x="810" y="642" fill="#64748b" font-size="9.5" text-anchor="middle">Plaintext Read-back 재검증</text>

  <!-- A/B 커밋 밴드 -->
  <rect x="30" y="662" width="900" height="22" rx="4" fill="#e2e8f0"/>
  <text x="40" y="678" fill="#334155" font-size="11" font-weight="bold">A/B 커밋</text>

  <rect x="675" y="692" width="270" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="810" y="714" fill="#166534" font-size="9.5" text-anchor="middle">UCB_SWAP 스왑 활성화 (FBL 단독)</text>

  <text x="315" y="756" fill="#166534" font-size="10.5" text-anchor="middle">10. 결과 보고 (INSTALL_COMPLETE)</text>
  <path d="M 478 762 L 152 762" stroke="#22c55e" stroke-width="1.8" marker-end="url(#s-ar-green)"/>

  <defs>
    <marker id="s-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="s-ar-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker>
  </defs>
</svg>
