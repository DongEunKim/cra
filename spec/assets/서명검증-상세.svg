<svg viewBox="0 0 1000 500" width="1000" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- 수신 컴포넌트 -->
  <rect x="40" y="100" width="300" height="300" rx="8" fill="#fde7e7" stroke="#ef9a9a"/>
  <text x="190" y="124" fill="#b91c1c" font-size="12.5" font-weight="bold" text-anchor="middle">수신 컴포넌트</text>
  <text x="190" y="141" fill="#64748b" font-size="9.5" text-anchor="middle">(eSync Server가 서명·동봉)</text>
  <rect x="58" y="154" width="264" height="54" rx="5" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="190" y="176" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">ZIP 컴포넌트</text>
  <text x="190" y="194" fill="#334155" font-size="10" text-anchor="middle">manifest.xml · binary</text>
  <rect x="58" y="216" width="264" height="34" rx="5" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="190" y="238" fill="#334155" font-size="11" text-anchor="middle">Signature</text>
  <rect x="58" y="258" width="264" height="40" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="190" y="283" fill="#334155" font-size="11" text-anchor="middle">CS Cert (리프 인증서)</text>
  <rect x="58" y="306" width="264" height="40" rx="5" fill="#ffffff" stroke="#f59e0b"/>
  <text x="190" y="331" fill="#334155" font-size="11" text-anchor="middle">Code Sign CA 인증서</text>
  <text x="190" y="372" fill="#64748b" font-size="9.5" text-anchor="middle">검증용 인증서를 함께 동봉</text>

  <!-- 전달 화살표 -->
  <path d="M 342 250 L 416 250" stroke="#334155" stroke-width="2" marker-end="url(#v-ar)"/>
  <text x="379" y="242" fill="#64748b" font-size="9" text-anchor="middle">전달</text>

  <!-- TGU -->
  <rect x="420" y="70" width="540" height="410" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="440" y="94" fill="#047857" font-size="12.5" font-weight="bold">TGU · eSync Agent (검증 수행)</text>

  <rect x="440" y="106" width="500" height="50" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.8"/>
  <text x="690" y="128" fill="#0f766e" font-size="11.5" font-weight="bold" text-anchor="middle">신뢰앵커: Root CA 인증서</text>
  <text x="690" y="146" fill="#64748b" font-size="9.5" text-anchor="middle">Tier-1 공장 주입 (프로비저닝 §1.3)</text>

  <rect x="440" y="172" width="500" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="452" y="192" fill="#334155" font-size="11" font-weight="bold">① 체인 구성</text>
  <text x="452" y="210" fill="#334155" font-size="10.5">Root(앵커) → Code Sign CA → CS Cert</text>

  <rect x="440" y="226" width="500" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="452" y="246" fill="#334155" font-size="11" font-weight="bold">② 서명 검증</text>
  <text x="452" y="264" fill="#334155" font-size="10.5">CS Cert 공개키로 Signature 검증 (ECDSA P-256)</text>

  <rect x="440" y="280" width="500" height="46" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="452" y="300" fill="#334155" font-size="11" font-weight="bold">③ 재해시</text>
  <text x="452" y="318" fill="#334155" font-size="10.5">수신 컴포넌트 SHA-256 재계산 → 서명값과 비교</text>

  <rect x="440" y="334" width="500" height="60" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="452" y="354" fill="#166534" font-size="11" font-weight="bold">④ 판정</text>
  <text x="452" y="373" fill="#166534" font-size="10.5">모두 통과 → 플래시 진행</text>
  <text x="452" y="389" fill="#b91c1c" font-size="10.5">하나라도 실패 → 폐기 (플래시 안 함)</text>

  <text x="440" y="424" fill="#64748b" font-size="9.5">EPOS-10i는 검증 능력이 없어, TGU가 대행 검증한 뒤 평문으로 플래시한다.</text>

  <!-- 앵커→① -->
  <path d="M 690 156 L 690 171" stroke="#0d9488" stroke-width="1.6" marker-end="url(#v-ar-teal)"/>
  <!-- 단계 흐름 -->
  <path d="M 690 218 L 690 225" stroke="#334155" stroke-width="1.4" marker-end="url(#v-ar)"/>
  <path d="M 690 272 L 690 279" stroke="#334155" stroke-width="1.4" marker-end="url(#v-ar)"/>
  <path d="M 690 326 L 690 333" stroke="#334155" stroke-width="1.4" marker-end="url(#v-ar)"/>

  <defs>
    <marker id="v-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="v-ar-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker>
  </defs>
</svg>
