<svg viewBox="0 0 1260 810" width="1260" height="810" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <text x="30" y="32" fill="#1e3a8a" font-size="14" font-weight="bold">장비(건설기계) 전장 아키텍처 — eSync Client/Agent 위치 · HSM · 업데이트 프로토콜 · 네트워크</text>

  <!-- DMS 외부 (좌측) -->
  <rect x="30" y="250" width="155" height="82" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="107" y="280" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">DMS</text>
  <text x="107" y="300" fill="#64748b" font-size="9.5" text-anchor="middle">유선 진단 PC</text>
  <text x="107" y="318" fill="#64748b" font-size="9.5" text-anchor="middle">(Windows)</text>

  <!-- 클라우드 -->
  <rect x="460" y="52" width="360" height="78" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
  <text x="640" y="74" fill="#1e3a8a" font-size="12" font-weight="bold" text-anchor="middle">클라우드</text>
  <rect x="480" y="84" width="150" height="36" rx="5" fill="#ffffff" stroke="#3b82f6"/>
  <text x="555" y="107" fill="#334155" font-size="10.5" text-anchor="middle">eSync Server</text>
  <rect x="650" y="84" width="150" height="36" rx="5" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="725" y="107" fill="#334155" font-size="10.5" text-anchor="middle">AWS IoT Core</text>

  <!-- mTLS 업링크 (TGU 셀룰러) -->
  <path d="M 730 250 L 730 132" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#a-ar-sky)"/>
  <text x="745" y="200" fill="#0369a1" font-size="10" font-weight="bold">mTLS (무선 OTA · 셀룰러)</text>

  <!-- 장비 존 -->
  <rect x="210" y="162" width="1030" height="612" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="230" y="186" fill="#334155" font-size="12" font-weight="bold">장비 E/E (In-Vehicle Network)</text>

  <!-- SGW (게이트웨이) -->
  <rect x="250" y="250" width="230" height="82" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="365" y="274" fill="#0f766e" font-size="12" font-weight="bold" text-anchor="middle">SGW (Security Gateway)</text>
  <rect x="268" y="286" width="62" height="22" rx="4" fill="#0d9488"/>
  <text x="299" y="302" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">HSM</text>
  <text x="410" y="302" fill="#334155" font-size="10" text-anchor="middle">CAN 게이트웨이</text>
  <text x="365" y="323" fill="#64748b" font-size="9.5" text-anchor="middle">UDS 0x29 — 외부 접근 통제</text>

  <!-- OBD-II DMS-SGW (좌측, 짧음) -->
  <path d="M 185 291 L 248 291" stroke="#9333ea" stroke-width="2" marker-end="url(#a-ar-purple)"/>
  <text x="217" y="283" fill="#6b21a8" font-size="9" text-anchor="middle">OBD-II</text>

  <!-- TGU (SGW 뒤 내부 노드) -->
  <rect x="560" y="250" width="340" height="132" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.8"/>
  <text x="730" y="272" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">TGU (Telematics Gateway Unit)</text>
  <rect x="578" y="282" width="304" height="24" rx="4" fill="#0ea5e9"/>
  <text x="730" y="299" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">eSync Client (오케스트레이션)</text>
  <text x="578" y="326" fill="#334155" font-size="9.5" font-weight="bold">제어기별 eSync Agent (현재 TGU에 co-locate):</text>
  <rect x="578" y="334" width="90" height="22" rx="4" fill="#3b82f6"/>
  <text x="623" y="350" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Agent·10i</text>
  <rect x="674" y="334" width="90" height="22" rx="4" fill="#3b82f6"/>
  <text x="719" y="350" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Agent·30i</text>
  <rect x="770" y="334" width="60" height="22" rx="4" fill="#3b82f6"/>
  <text x="800" y="350" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Agent·ECU</text>
  <text x="730" y="374" fill="#64748b" font-size="9" text-anchor="middle">CAN상 SGW 뒤의 내부 노드 · 클라우드 업링크 보유</text>

  <!-- 노드 → CAN 버스 -->
  <path d="M 310 332 L 310 438" stroke="#334155" stroke-width="2" marker-end="url(#a-ar)"/>
  <path d="M 730 382 L 730 438" stroke="#334155" stroke-width="2" marker-end="url(#a-ar)"/>

  <!-- 진단전용 Private CAN (SGW → ECU, 케이스 2) -->
  <path d="M 470 332 L 708 486" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#a-ar-org)"/>
  <text x="500" y="424" fill="#c2410c" font-size="9" font-weight="bold">진단전용 Private CAN</text>
  <text x="500" y="438" fill="#c2410c" font-size="8.5">(ECU 유선 케이스 2)</text>

  <!-- CAN 버스 -->
  <line x1="250" y1="446" x2="1210" y2="446" stroke="#334155" stroke-width="3"/>
  <text x="270" y="438" fill="#334155" font-size="10" font-weight="bold">CAN 버스 (UDS on CAN)</text>

  <!-- EPOS-10i -->
  <line x1="365" y1="446" x2="365" y2="484" stroke="#334155" stroke-width="2"/>
  <rect x="270" y="484" width="190" height="168" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="365" y="508" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">EPOS-10i</text>
  <rect x="320" y="518" width="90" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="365" y="535" fill="#64748b" font-size="9.5" font-weight="bold" text-anchor="middle">HSM 없음</text>
  <text x="365" y="562" fill="#334155" font-size="9.5" text-anchor="middle">검증: TGU 대행(Agent·10i)</text>
  <text x="365" y="582" fill="#334155" font-size="9.5" text-anchor="middle">페이로드: 평문</text>
  <text x="365" y="602" fill="#334155" font-size="9.5" text-anchor="middle">세션: UDS 0x27</text>
  <text x="365" y="626" fill="#64748b" font-size="9" text-anchor="middle">싱글뱅크 + Insurance Kernel</text>

  <!-- EPOS-30i -->
  <line x1="585" y1="446" x2="585" y2="484" stroke="#334155" stroke-width="2"/>
  <rect x="490" y="484" width="190" height="168" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="585" y="508" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">EPOS-30i</text>
  <rect x="550" y="518" width="70" height="24" rx="4" fill="#f59e0b"/>
  <text x="585" y="535" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">HSM</text>
  <text x="585" y="562" fill="#334155" font-size="9.5" text-anchor="middle">검증: 제어기 자체(Agent·30i)</text>
  <text x="585" y="582" fill="#334155" font-size="9.5" text-anchor="middle">페이로드: 암호화</text>
  <text x="585" y="602" fill="#334155" font-size="9.5" text-anchor="middle">세션: UDS 0x29</text>
  <text x="585" y="626" fill="#64748b" font-size="9" text-anchor="middle">A/B Dual Bank</text>

  <!-- ECU (엔진 제어기) -->
  <line x1="805" y1="446" x2="805" y2="484" stroke="#334155" stroke-width="2"/>
  <rect x="710" y="484" width="200" height="168" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
  <text x="810" y="508" fill="#9a3412" font-size="12" font-weight="bold" text-anchor="middle">ECU (엔진 제어기)</text>
  <rect x="758" y="518" width="104" height="24" rx="4" fill="#ea580c"/>
  <text x="810" y="535" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">HSM 모델별</text>
  <text x="810" y="562" fill="#334155" font-size="9.5" text-anchor="middle">검증: 유무 분기(31/32)</text>
  <text x="810" y="582" fill="#334155" font-size="9.5" text-anchor="middle">페이로드: 평문/암호화</text>
  <text x="810" y="602" fill="#334155" font-size="9.5" text-anchor="middle">세션: 0x27 / 0x29</text>
  <text x="810" y="626" fill="#64748b" font-size="9" text-anchor="middle">31·32 프로파일 상속</text>

  <!-- 기타 -->
  <line x1="1040" y1="446" x2="1040" y2="484" stroke="#334155" stroke-width="2"/>
  <rect x="940" y="484" width="200" height="168" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="1040" y="508" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">기타 제어기</text>
  <text x="1040" y="528" fill="#64748b" font-size="9.5" text-anchor="middle">(기타 내부 제어기)</text>
  <text x="1040" y="558" fill="#334155" font-size="9.5" text-anchor="middle">HSM: 모델별</text>
  <text x="1040" y="578" fill="#334155" font-size="9.5" text-anchor="middle">능력별 변주 적용</text>
  <text x="1040" y="604" fill="#64748b" font-size="9" text-anchor="middle">향후 이더넷 제어기 포함</text>

  <!-- 노트 -->
  <text x="250" y="682" fill="#475569" font-size="10">• eSync Agent는 제어기별로 하나이며(현재 TGU에 co-locate), 각 Agent가 해당 제어기의 검증·전달을 담당한다.</text>
  <text x="250" y="700" fill="#475569" font-size="10">• SGW는 게이트웨이(외부 OBD-II 접근 통제), TGU·제어기는 CAN상 SGW 뒤의 내부 노드다.</text>
  <text x="250" y="718" fill="#475569" font-size="10">• 무선 OTA: 클라우드 → TGU → CAN → 제어기.   유선: DMS → OBD-II → SGW → CAN → 제어기.</text>
  <text x="250" y="736" fill="#475569" font-size="10">• ECU는 HSM 유무로 31/32 프로파일이 갈리며, 유선 수정불가 진단툴은 SGW–ECU 진단전용 Private CAN으로 라우팅된다(케이스 2).</text>

  <!-- 범례 (가로) -->
  <rect x="250" y="750" width="26" height="14" rx="3" fill="#3b82f6"/>
  <text x="282" y="761" fill="#334155" font-size="9">eSync Agent</text>
  <rect x="370" y="750" width="26" height="14" rx="3" fill="#f59e0b"/>
  <text x="402" y="761" fill="#334155" font-size="9">HSM 보유</text>
  <line x1="480" y1="757" x2="506" y2="757" stroke="#334155" stroke-width="3"/>
  <text x="512" y="761" fill="#334155" font-size="9">CAN</text>
  <line x1="565" y1="757" x2="591" y2="757" stroke="#0ea5e9" stroke-width="2"/>
  <text x="597" y="761" fill="#334155" font-size="9">mTLS(무선)</text>
  <line x1="690" y1="757" x2="716" y2="757" stroke="#9333ea" stroke-width="2"/>
  <text x="722" y="761" fill="#334155" font-size="9">OBD-II(유선)</text>
  <line x1="820" y1="757" x2="846" y2="757" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="852" y="761" fill="#334155" font-size="9">진단전용 CAN</text>

  <defs>
    <marker id="a-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="a-ar-sky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="a-ar-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/></marker>
    <marker id="a-ar-org" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ea580c"/></marker>
  </defs>
</svg>
