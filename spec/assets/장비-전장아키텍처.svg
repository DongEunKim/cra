<svg viewBox="0 0 1020 760" width="1020" height="760" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <text x="30" y="34" fill="#1e3a8a" font-size="14" font-weight="bold">장비(건설기계) 전장 아키텍처 — eSync Client/Agent 위치 · HSM · 업데이트 프로토콜 · 네트워크</text>

  <!-- 클라우드 -->
  <rect x="330" y="52" width="360" height="80" rx="8" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.6"/>
  <text x="510" y="74" fill="#1e3a8a" font-size="12" font-weight="bold" text-anchor="middle">클라우드</text>
  <rect x="350" y="84" width="150" height="36" rx="5" fill="#ffffff" stroke="#3b82f6"/>
  <text x="425" y="107" fill="#334155" font-size="10.5" text-anchor="middle">eSync Server</text>
  <rect x="520" y="84" width="150" height="36" rx="5" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="595" y="107" fill="#334155" font-size="10.5" text-anchor="middle">AWS IoT Core</text>

  <!-- mTLS -->
  <path d="M 510 132 L 510 178" stroke="#0ea5e9" stroke-width="2.2" marker-end="url(#a-ar-sky)"/>
  <text x="540" y="160" fill="#0369a1" font-size="10" font-weight="bold">mTLS (무선 OTA)</text>

  <!-- 장비 존 -->
  <rect x="30" y="185" width="810" height="545" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
  <text x="50" y="210" fill="#334155" font-size="12" font-weight="bold">장비 E/E (In-Vehicle Network)</text>

  <!-- TGU -->
  <rect x="380" y="230" width="260" height="96" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.8"/>
  <text x="510" y="253" fill="#0369a1" font-size="12.5" font-weight="bold" text-anchor="middle">TGU (Telematics Gateway Unit)</text>
  <rect x="398" y="266" width="110" height="26" rx="4" fill="#0ea5e9"/>
  <text x="453" y="284" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">eSync Client</text>
  <rect x="514" y="266" width="110" height="26" rx="4" fill="#3b82f6"/>
  <text x="569" y="284" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">eSync Agent</text>
  <text x="510" y="312" fill="#64748b" font-size="9.5" text-anchor="middle">신뢰 경계: OTA 다운로드·전달까지 · Ethernet + CAN</text>

  <!-- 이더넷 제어기 (향후) -->
  <rect x="670" y="230" width="150" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4,3"/>
  <text x="745" y="256" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">이더넷 제어기</text>
  <text x="745" y="274" fill="#64748b" font-size="9.5" text-anchor="middle">Linux/Android</text>
  <text x="745" y="292" fill="#64748b" font-size="9.5" text-anchor="middle">Verified Boot (향후)</text>
  <text x="745" y="312" fill="#94a3b8" font-size="9" text-anchor="middle">HSM: 플랫폼별</text>

  <!-- Ethernet link TGU-이더넷제어기 -->
  <path d="M 640 278 L 668 278" stroke="#0ea5e9" stroke-width="2" marker-end="url(#a-ar-sky)"/>
  <text x="654" y="270" fill="#0369a1" font-size="8.5" text-anchor="middle">Eth</text>

  <!-- TGU -> SGW (Ethernet/내부) -->
  <path d="M 510 326 L 510 372" stroke="#0d9488" stroke-width="2" marker-end="url(#a-ar-teal)"/>
  <text x="540" y="354" fill="#0f766e" font-size="9.5">Ethernet</text>

  <!-- SGW -->
  <rect x="380" y="376" width="260" height="86" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="510" y="399" fill="#0f766e" font-size="12" font-weight="bold" text-anchor="middle">SGW (Security Gateway)</text>
  <rect x="398" y="410" width="70" height="24" rx="4" fill="#0d9488"/>
  <text x="433" y="427" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">HSM</text>
  <text x="560" y="427" fill="#334155" font-size="10" text-anchor="middle">CAN 게이트웨이</text>
  <text x="510" y="450" fill="#64748b" font-size="9.5" text-anchor="middle">UDS 0x29 APCE — CAN 세그먼트 접근 통제</text>

  <!-- 유선 DMS -->
  <rect x="850" y="376" width="150" height="86" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="925" y="402" fill="#6b21a8" font-size="11" font-weight="bold" text-anchor="middle">DMS</text>
  <text x="925" y="420" fill="#64748b" font-size="9.5" text-anchor="middle">유선 진단 PC</text>
  <text x="925" y="440" fill="#64748b" font-size="9.5" text-anchor="middle">(Windows)</text>
  <path d="M 848 419 L 642 419" stroke="#9333ea" stroke-width="2" marker-end="url(#a-ar-purple)"/>
  <text x="745" y="411" fill="#6b21a8" font-size="9" text-anchor="middle">OBD-II (유선)</text>

  <!-- CAN 버스 -->
  <path d="M 510 462 L 510 500" stroke="#334155" stroke-width="2" marker-end="url(#a-ar)"/>
  <line x1="70" y1="510" x2="780" y2="510" stroke="#334155" stroke-width="3"/>
  <text x="90" y="502" fill="#334155" font-size="10" font-weight="bold">CAN 버스 (UDS on CAN)</text>

  <!-- EPOS-10i -->
  <line x1="180" y1="510" x2="180" y2="548" stroke="#334155" stroke-width="2"/>
  <rect x="80" y="548" width="200" height="150" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/>
  <text x="180" y="572" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">EPOS-10i</text>
  <rect x="98" y="584" width="90" height="24" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="143" y="601" fill="#64748b" font-size="9.5" font-weight="bold" text-anchor="middle">HSM 없음</text>
  <text x="180" y="628" fill="#334155" font-size="9.5" text-anchor="middle">검증: TGU 대행</text>
  <text x="180" y="646" fill="#334155" font-size="9.5" text-anchor="middle">페이로드: 평문</text>
  <text x="180" y="664" fill="#334155" font-size="9.5" text-anchor="middle">세션: UDS 0x27</text>
  <text x="180" y="682" fill="#64748b" font-size="9" text-anchor="middle">싱글뱅크 + Insurance Kernel</text>

  <!-- EPOS-30i -->
  <line x1="425" y1="510" x2="425" y2="548" stroke="#334155" stroke-width="2"/>
  <rect x="325" y="548" width="200" height="150" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="425" y="572" fill="#b45309" font-size="12" font-weight="bold" text-anchor="middle">EPOS-30i</text>
  <rect x="343" y="584" width="70" height="24" rx="4" fill="#f59e0b"/>
  <text x="378" y="601" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">HSM</text>
  <text x="425" y="628" fill="#334155" font-size="9.5" text-anchor="middle">검증: 제어기 자체</text>
  <text x="425" y="646" fill="#334155" font-size="9.5" text-anchor="middle">페이로드: 암호화</text>
  <text x="425" y="664" fill="#334155" font-size="9.5" text-anchor="middle">세션: UDS 0x29</text>
  <text x="425" y="682" fill="#64748b" font-size="9" text-anchor="middle">A/B Dual Bank</text>

  <!-- 기타 제어기 -->
  <line x1="670" y1="510" x2="670" y2="548" stroke="#334155" stroke-width="2"/>
  <rect x="570" y="548" width="200" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4,3"/>
  <text x="670" y="572" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">기타 제어기</text>
  <text x="670" y="596" fill="#64748b" font-size="9.5" text-anchor="middle">(내/외부 ECU)</text>
  <text x="670" y="628" fill="#334155" font-size="9.5" text-anchor="middle">HSM: 모델별</text>
  <text x="670" y="646" fill="#334155" font-size="9.5" text-anchor="middle">UDS on CAN</text>
  <text x="670" y="672" fill="#64748b" font-size="9" text-anchor="middle">능력별 변주 적용</text>

  <!-- 범례 -->
  <rect x="860" y="500" width="150" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="875" y="522" fill="#334155" font-size="10.5" font-weight="bold">범례</text>
  <rect x="875" y="532" width="28" height="16" rx="3" fill="#3b82f6"/>
  <text x="910" y="545" fill="#334155" font-size="9">eSync Agent</text>
  <rect x="875" y="554" width="28" height="16" rx="3" fill="#f59e0b"/>
  <text x="910" y="567" fill="#334155" font-size="9">HSM 보유</text>
  <line x1="875" y1="582" x2="903" y2="582" stroke="#334155" stroke-width="3"/>
  <text x="910" y="586" fill="#334155" font-size="9">CAN</text>
  <line x1="875" y1="600" x2="903" y2="600" stroke="#0ea5e9" stroke-width="2"/>
  <text x="910" y="604" fill="#334155" font-size="9">Ethernet</text>

  <defs>
    <marker id="a-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="a-ar-sky" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="a-ar-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker>
    <marker id="a-ar-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/></marker>
  </defs>
</svg>
