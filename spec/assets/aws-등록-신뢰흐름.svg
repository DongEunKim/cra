<svg viewBox="0 0 1100 548" width="1100" height="548" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <text x="40" y="30" fill="#1e3a8a" font-size="13" font-weight="bold">① 등록·발급 (자체 PKI → AWS 등록 · eSync Server 공유)</text>

  <!-- OEM Root CA -->
  <rect x="40" y="46" width="210" height="52" rx="7" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
  <text x="145" y="70" fill="#1e3a8a" font-size="12.5" font-weight="bold" text-anchor="middle">OEM Root CA</text>
  <text x="145" y="88" fill="#64748b" font-size="9.5" text-anchor="middle">자체 PKI · 자기서명 인증서</text>

  <!-- Device CA -->
  <rect x="40" y="132" width="210" height="60" rx="7" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="145" y="156" fill="#0f766e" font-size="12.5" font-weight="bold" text-anchor="middle">Device CA</text>
  <text x="145" y="176" fill="#64748b" font-size="9.5" text-anchor="middle">디바이스 인증서 발급 · KMS</text>
  <path d="M 145 98 L 145 130" stroke="#334155" stroke-width="1.8" marker-end="url(#a-ar)"/>
  <text x="152" y="118" fill="#64748b" font-size="9">발급</text>

  <!-- AWS IoT Core -->
  <rect x="440" y="44" width="300" height="86" rx="7" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.8"/>
  <text x="590" y="66" fill="#0e7490" font-size="12.5" font-weight="bold" text-anchor="middle">AWS IoT Core (연결점)</text>
  <text x="456" y="88" fill="#334155" font-size="10">· 등록된 Device CA 인증서 (RegisterCACertificate)</text>
  <text x="456" y="107" fill="#334155" font-size="10">· 엔드포인트 서버 인증서 = Amazon Trust Services</text>

  <!-- eSync Server -->
  <rect x="440" y="150" width="300" height="86" rx="7" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8"/>
  <text x="590" y="172" fill="#1e3a8a" font-size="12.5" font-weight="bold" text-anchor="middle">eSync Server</text>
  <text x="456" y="194" fill="#334155" font-size="10">· 공유 Device CA 인증서 (TGU 검증용 앵커)</text>
  <text x="456" y="213" fill="#334155" font-size="10">· 서버 인증서 = OEM Root CA 체인 발급</text>

  <!-- Device CA → AWS / eSync -->
  <path d="M 250 150 L 438 86" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a-ar)"/>
  <text x="300" y="112" fill="#334155" font-size="9.5">Device CA 인증서 등록</text>
  <path d="M 250 178 L 438 192" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#a-ar)"/>
  <text x="300" y="205" fill="#334155" font-size="9.5">Device CA 인증서 공유</text>

  <!-- ② TGU -->
  <text x="40" y="286" fill="#15803d" font-size="13" font-weight="bold">② TGU 보유물 (Tier-1 주입) · 검증 관계</text>

  <rect x="40" y="300" width="470" height="212" rx="8" fill="#f0fdf4" stroke="#34d399" stroke-width="1.8"/>
  <text x="60" y="324" fill="#047857" font-size="12" font-weight="bold">TGU 보유 (공정에서 미리 주입)</text>
  <text x="60" y="350" fill="#334155" font-size="10.5">· 디바이스 인증서 (Device CA 발급, CN=Serial)</text>
  <text x="60" y="374" fill="#334155" font-size="10.5">· 개인키 (제어기 생성 · 반출 불가)</text>
  <text x="60" y="398" fill="#334155" font-size="10.5">· Device CA(signer) 인증서 (최초 핸드셰이크 체인용)</text>
  <text x="60" y="422" fill="#0e7490" font-size="10.5" font-weight="bold">· Amazon Root CA 인증서 (전송 엔드포인트 검증)</text>
  <text x="60" y="446" fill="#1e3a8a" font-size="10.5" font-weight="bold">· OEM Root CA 인증서 (코드서명 · eSync Server 검증)</text>
  <text x="60" y="474" fill="#64748b" font-size="9.5">신뢰앵커는 모두 인증서(자기서명 CA 인증서)다 — 공개키만으론 경로 검증 불가.</text>
  <path d="M 145 192 L 145 260 L 275 260 L 275 298" stroke="#0d9488" stroke-width="1.8" fill="none" marker-end="url(#a-ar-teal)"/>
  <text x="150" y="252" fill="#0f766e" font-size="9">디바이스 인증서 발급 + 개인키(제어기 생성) · Tier-1</text>

  <!-- 검증 관계 -->
  <rect x="540" y="300" width="520" height="212" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="560" y="324" fill="#334155" font-size="12" font-weight="bold">검증 관계 (앵커 = 인증서)</text>
  <line x1="560" y1="336" x2="1040" y2="336" stroke="#e2e8f0"/>
  <text x="560" y="360" fill="#334155" font-size="10.5">TGU → AWS IoT Core 엔드포인트</text>
  <text x="1024" y="360" fill="#0e7490" font-size="10.5" font-weight="bold" text-anchor="end">Amazon Root CA 인증서</text>
  <text x="560" y="388" fill="#334155" font-size="10.5">TGU → eSync Server</text>
  <text x="1024" y="388" fill="#1e3a8a" font-size="10.5" font-weight="bold" text-anchor="end">OEM Root CA 인증서</text>
  <text x="560" y="416" fill="#334155" font-size="10.5">TGU → 펌웨어 (CS Cert 체인)</text>
  <text x="1024" y="416" fill="#1e3a8a" font-size="10.5" font-weight="bold" text-anchor="end">OEM Root CA 인증서</text>
  <text x="560" y="444" fill="#334155" font-size="10.5">AWS IoT Core → TGU</text>
  <text x="1024" y="444" fill="#0f766e" font-size="10.5" font-weight="bold" text-anchor="end">등록된 Device CA 인증서</text>
  <text x="560" y="472" fill="#334155" font-size="10.5">eSync Server → TGU</text>
  <text x="1024" y="472" fill="#0f766e" font-size="10.5" font-weight="bold" text-anchor="end">공유 Device CA 인증서</text>
  <text x="560" y="498" fill="#64748b" font-size="9.5">목적별 복수 신뢰앵커 보유는 표준(RFC 5280).</text>

  <defs>
    <marker id="a-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="a-ar-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker>
  </defs>
</svg>
