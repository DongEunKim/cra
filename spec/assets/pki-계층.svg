<svg viewBox="0 0 1120 620" width="1120" height="620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- OEM Root CA -->
  <rect x="435" y="28" width="250" height="72" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="560" y="58" fill="#1e3a8a" font-size="15" font-weight="bold" text-anchor="middle">OEM Root CA (최상위 인증기관)</text>
  <text x="560" y="80" fill="#64748b" font-size="10.5" text-anchor="middle">HD건설기계 · 개인키(서명키) 오프라인 보관</text>

  <!-- 발급 화살표 (3분기) -->
  <path d="M 560 100 L 560 130 L 200 130 L 200 184" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <path d="M 560 130 L 560 184" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <path d="M 560 130 L 920 130 L 920 184" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#p-ar)"/>
  <text x="360" y="124" fill="#64748b" font-size="10" text-anchor="middle">발급</text>
  <text x="760" y="124" fill="#64748b" font-size="10" text-anchor="middle">발급</text>

  <!-- Device CA -->
  <rect x="30" y="186" width="340" height="212" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="200" y="214" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="middle">Device CA</text>
  <text x="200" y="234" fill="#64748b" font-size="10.5" text-anchor="middle">디바이스 인증서 발급기관 · 개인키 KMS 보관</text>
  <rect x="48" y="254" width="304" height="124" rx="6" fill="#ffffff" stroke="#0d9488"/>
  <text x="200" y="290" fill="#0f766e" font-size="12.5" font-weight="bold" text-anchor="middle">Dev Cert — 디바이스 인증서</text>
  <text x="200" y="312" fill="#334155" font-size="10.5" text-anchor="middle">CN = Serial · EKU clientAuth</text>
  <text x="200" y="333" fill="#334155" font-size="10.5" text-anchor="middle">Tier-1 발급 · mTLS 신원</text>
  <text x="200" y="360" fill="#64748b" font-size="10" text-anchor="middle">TGU 신원 (개인키는 제어기 보관)</text>

  <!-- Code Sign CA -->
  <rect x="390" y="186" width="340" height="212" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="560" y="214" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">Code Sign CA</text>
  <text x="560" y="234" fill="#64748b" font-size="10.5" text-anchor="middle">코드서명 인증서 발급기관 · 개인키 KMS 보관</text>
  <rect x="408" y="254" width="304" height="124" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <text x="560" y="290" fill="#b45309" font-size="12.5" font-weight="bold" text-anchor="middle">CS Cert — 코드서명 인증서</text>
  <text x="560" y="312" fill="#334155" font-size="10.5" text-anchor="middle">EKU codeSigning</text>
  <text x="560" y="333" fill="#334155" font-size="10.5" text-anchor="middle">개인키(KMS)로 컴포넌트 서명</text>
  <text x="560" y="360" fill="#64748b" font-size="10" text-anchor="middle">단수명 · 컴포넌트에 인증서 동봉</text>

  <!-- Diagnostic License CA -->
  <rect x="750" y="186" width="340" height="212" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="920" y="214" fill="#6b21a8" font-size="14" font-weight="bold" text-anchor="middle">진단 라이선스 CA</text>
  <text x="920" y="234" fill="#64748b" font-size="10.5" text-anchor="middle">DMS 라이선스 발급기관 · 개인키 KMS 보관</text>
  <rect x="768" y="254" width="304" height="124" rx="6" fill="#ffffff" stroke="#9333ea"/>
  <text x="920" y="290" fill="#6b21a8" font-size="12.5" font-weight="bold" text-anchor="middle">DMS 라이선스</text>
  <text x="920" y="312" fill="#334155" font-size="10.5" text-anchor="middle">Role OID · 단수명</text>
  <text x="920" y="333" fill="#334155" font-size="10.5" text-anchor="middle">이중용도: UDS 0x29 APCE + mTLS</text>
  <text x="920" y="360" fill="#64748b" font-size="10" text-anchor="middle">PC 고유 ID + 사용자 인증 후 발급</text>

  <!-- 주석 -->
  <rect x="30" y="424" width="1060" height="92" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="46" y="448" fill="#1e3a8a" font-size="12" font-weight="bold">신뢰앵커·역할</text>
  <text x="46" y="470" fill="#334155" font-size="11">• 디바이스는 Root CA 인증서를 신뢰앵커로 보유하고, "Root → 목적별 CA → 리프"라는 같은 규칙으로 검증한다.</text>
  <text x="46" y="491" fill="#334155" font-size="11">• eSync Server는 CS Cert 개인키(KMS)로 컴포넌트에 서명하고, 디바이스·DMS 인증서를 검증한다(발급은 각 CA).</text>
  <text x="46" y="509" fill="#64748b" font-size="10">• DMS 라이선스는 하나의 인증서를 SGW가 UDS 0x29 APCE로, TGU가 mTLS로 검증한다.</text>

  <defs>
    <marker id="p-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
  </defs>
</svg>
