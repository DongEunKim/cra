<svg viewBox="0 0 900 560" width="900" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- OEM Root CA -->
  <rect x="325" y="28" width="250" height="72" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="2.5"/>
  <text x="450" y="58" fill="#1e3a8a" font-size="15" font-weight="bold" text-anchor="middle">OEM Root CA (최상위 인증기관)</text>
  <text x="450" y="80" fill="#64748b" font-size="10.5" text-anchor="middle">HD건설기계 · 개인키(서명키) 오프라인 보관</text>

  <!-- 발급 화살표 -->
  <path d="M 450 100 L 450 130 L 255 130 L 255 186" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M 450 130 L 645 130 L 645 186" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text x="352" y="124" fill="#64748b" font-size="10" text-anchor="middle">발급</text>
  <text x="548" y="124" fill="#64748b" font-size="10" text-anchor="middle">발급</text>

  <!-- Device CA -->
  <rect x="90" y="188" width="330" height="212" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <text x="255" y="216" fill="#0f766e" font-size="14" font-weight="bold" text-anchor="middle">Device CA</text>
  <text x="255" y="236" fill="#64748b" font-size="10.5" text-anchor="middle">디바이스 인증서 발급기관 · 개인키 KMS 보관</text>
  <!-- Dev leaf cert -->
  <rect x="128" y="256" width="254" height="122" rx="6" fill="#ffffff" stroke="#0d9488"/>
  <g transform="translate(150,286)">
    <rect x="0" y="0" width="34" height="42" rx="3" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
    <line x1="7" y1="12" x2="27" y2="12" stroke="#0d9488" stroke-width="2"/>
    <line x1="7" y1="20" x2="27" y2="20" stroke="#0d9488" stroke-width="2"/>
    <line x1="7" y1="28" x2="20" y2="28" stroke="#0d9488" stroke-width="2"/>
    <circle cx="27" cy="38" r="7" fill="#0d9488"/>
  </g>
  <text x="255" y="292" fill="#0f766e" font-size="12.5" font-weight="bold" text-anchor="middle">Dev Cert — 디바이스 인증서</text>
  <text x="255" y="313" fill="#334155" font-size="10.5" text-anchor="middle">엔드엔티티(리프) 인증서 · CN = Serial</text>
  <text x="255" y="333" fill="#334155" font-size="10.5" text-anchor="middle">Tier-1 공정에서 발급</text>
  <text x="255" y="353" fill="#64748b" font-size="10" text-anchor="middle">개인키는 제어기가 생성·보관</text>

  <!-- Code Sign CA -->
  <rect x="480" y="188" width="330" height="212" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="645" y="216" fill="#b45309" font-size="14" font-weight="bold" text-anchor="middle">Code Sign CA</text>
  <text x="645" y="236" fill="#64748b" font-size="10.5" text-anchor="middle">코드서명 인증서 발급기관 · 개인키 KMS 보관</text>
  <!-- CS leaf cert -->
  <rect x="518" y="256" width="254" height="122" rx="6" fill="#ffffff" stroke="#f59e0b"/>
  <g transform="translate(540,286)">
    <rect x="0" y="0" width="34" height="42" rx="3" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="7" y1="12" x2="27" y2="12" stroke="#f59e0b" stroke-width="2"/>
    <line x1="7" y1="20" x2="27" y2="20" stroke="#f59e0b" stroke-width="2"/>
    <line x1="7" y1="28" x2="20" y2="28" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="27" cy="38" r="7" fill="#f59e0b"/>
  </g>
  <text x="645" y="292" fill="#b45309" font-size="12.5" font-weight="bold" text-anchor="middle">CS Cert — 코드서명 인증서</text>
  <text x="645" y="313" fill="#334155" font-size="10.5" text-anchor="middle">엔드엔티티(리프) 인증서 · EKU=codeSigning</text>
  <text x="645" y="333" fill="#334155" font-size="10.5" text-anchor="middle">개인키(KMS)로 컴포넌트 서명</text>
  <text x="645" y="353" fill="#64748b" font-size="10" text-anchor="middle">단수명 · 컴포넌트에 인증서 동봉</text>

  <!-- eSync Server 역할 주석 -->
  <rect x="90" y="428" width="720" height="90" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="106" y="452" fill="#1e3a8a" font-size="12" font-weight="bold">eSync Server 의 역할</text>
  <text x="106" y="475" fill="#334155" font-size="11">• 컴포넌트 서명 — 서명에 쓰는 개인키는 KMS 안 CS Cert(리프)의 개인키. 서버는 서명을 요청한다.</text>
  <text x="106" y="497" fill="#334155" font-size="11">• 디바이스 인증서 검증(mTLS) — 인증서 발급은 Device CA가 담당한다.</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
  </defs>
</svg>
