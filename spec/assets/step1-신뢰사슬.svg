<svg viewBox="0 0 840 440" width="840" height="440" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- 액터 박스 -->
  <rect x="50" y="20" width="120" height="46" rx="6" fill="#64748b"/>
  <text x="110" y="42" fill="white" font-size="12" font-weight="bold" text-anchor="middle">GPDM</text>
  <text x="110" y="58" fill="#e2e8f0" font-size="9" text-anchor="middle">소스 · 원장</text>

  <rect x="250" y="20" width="150" height="46" rx="6" fill="#1e3a8a"/>
  <text x="325" y="48" fill="white" font-size="12" font-weight="bold" text-anchor="middle">eSync Server</text>

  <rect x="470" y="20" width="185" height="46" rx="6" fill="#0ea5e9"/>
  <text x="562" y="42" fill="white" font-size="12" font-weight="bold" text-anchor="middle">eSync Client / Agent</text>
  <text x="562" y="58" fill="#e0f2fe" font-size="9" text-anchor="middle">동거 노드 (게이트웨이)</text>

  <rect x="710" y="20" width="120" height="46" rx="6" fill="#f59e0b"/>
  <text x="770" y="42" fill="white" font-size="12" font-weight="bold" text-anchor="middle">ECU</text>
  <text x="770" y="58" fill="#fef3c7" font-size="9" text-anchor="middle">자원제약 · 검증 불가</text>

  <!-- 레인 -->
  <line x1="110" y1="66" x2="110" y2="400" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.5"/>
  <line x1="325" y1="66" x2="325" y2="400" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.5"/>
  <line x1="562" y1="66" x2="562" y2="400" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.5"/>
  <line x1="770" y1="66" x2="770" y2="400" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.5"/>

  <!-- 1. GPDM → Server -->
  <text x="217" y="98" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">1. Component + SW BOM</text>
  <path d="M 112 106 L 323 106" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <!-- 2. server signing (self) -->
  <rect x="250" y="126" width="150" height="34" rx="4" fill="#eff6ff" stroke="#1e3a8a"/>
  <text x="325" y="148" fill="#1e3a8a" font-size="10.5" font-weight="bold" text-anchor="middle">2. server signing</text>

  <!-- 3. Server → Client/Agent -->
  <text x="443" y="188" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">3. 서명된 Component</text>
  <path d="M 327 196 L 560 196" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <text x="443" y="212" fill="#64748b" font-size="9" text-anchor="middle">bulk: 펌웨어 파일 서버(HTTPS)</text>

  <!-- 4. 검증 (self) -->
  <rect x="470" y="230" width="185" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="562" y="252" fill="#0369a1" font-size="10.5" font-weight="bold" text-anchor="middle">4. server signature · 해시 검증</text>

  <!-- 5. Agent → ECU -->
  <text x="666" y="294" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">5. UDS on CAN 플래시 (평문)</text>
  <text x="666" y="309" fill="#b45309" font-size="9" text-anchor="middle">검증 성공 시에만</text>
  <path d="M 564 317 L 768 317" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arw-amber)"/>

  <!-- 6. ECU → Agent (결과) -->
  <text x="666" y="349" fill="#64748b" font-size="10" text-anchor="middle">6. 플래시 결과</text>
  <path d="M 768 357 L 564 357" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5,4" fill="none" marker-end="url(#arw-gray)"/>

  <!-- 하단 노트 -->
  <text x="50" y="422" fill="#64748b" font-size="9.5">ECU는 복호화·서명검증 불가 → eSync Agent가 last secure hop(마지막 검증자). 검증 실패 시 폐기, 플래시하지 않음.</text>

  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="arw-amber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="arw-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
  </defs>
</svg>
