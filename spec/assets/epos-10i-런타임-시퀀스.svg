<svg viewBox="0 0 1080 562" width="1080" height="562" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- 액터 -->
  <rect x="40" y="20" width="150" height="44" rx="6" fill="#1e3a8a"/>
  <text x="115" y="47" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">eSync Server</text>
  <rect x="240" y="20" width="160" height="44" rx="6" fill="#06b6d4"/>
  <text x="320" y="41" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">펌웨어 파일 서버</text>
  <text x="320" y="57" fill="#cffafe" font-size="9" text-anchor="middle">HTTPS · bulk</text>
  <rect x="470" y="20" width="140" height="44" rx="6" fill="#0ea5e9"/>
  <text x="540" y="47" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">eSync Client</text>
  <rect x="690" y="20" width="130" height="44" rx="6" fill="#3b82f6"/>
  <text x="755" y="47" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">eSync Agent</text>
  <rect x="900" y="20" width="150" height="44" rx="6" fill="#f59e0b"/>
  <text x="975" y="41" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">EPOS-10i</text>
  <text x="975" y="57" fill="#fef3c7" font-size="9" text-anchor="middle">OSEK · Single Bank</text>

  <!-- 레인 -->
  <line x1="115" y1="64" x2="115" y2="544" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="320" y1="64" x2="320" y2="544" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="540" y1="64" x2="540" y2="544" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="755" y1="64" x2="755" y2="544" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>
  <line x1="975" y1="64" x2="975" y2="544" stroke="#94a3b8" stroke-dasharray="5,5" stroke-width="1.4"/>

  <!-- 1 -->
  <text x="327" y="92" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">1. 버전 보고 · 업데이트 확인</text>
  <path d="M 538 100 L 117 100" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 2 -->
  <text x="327" y="122" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">2. Campaign 有 → 다운로드 메타데이터</text>
  <path d="M 117 130 L 538 130" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 3 -->
  <text x="430" y="152" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">3. Component 다운로드 요청</text>
  <path d="M 538 160 L 322 160" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 4 -->
  <text x="430" y="182" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">4. Component(ZIP) 전달 · 청크 해시</text>
  <path d="M 322 190 L 538 190" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 5 -->
  <text x="648" y="212" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">5. Component 전달 (IPC)</text>
  <path d="M 542 220 L 753 220" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 6 box -->
  <rect x="583" y="236" width="344" height="36" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="755" y="259" fill="#1e40af" font-size="10" font-weight="bold" text-anchor="middle">6. 서명 검증 — Root→CS Cert 체인 · ECDSA · Component 재해시 비교</text>
  <!-- 7 -->
  <text x="865" y="296" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">7. 호환성 확인 (UDS 0x22)</text>
  <path d="M 757 304 L 973 304" stroke="#334155" stroke-width="1.8" marker-end="url(#r-ar)"/>
  <!-- 8 -->
  <text x="865" y="324" fill="#64748b" font-size="9.5" text-anchor="middle">8. HW ID 응답</text>
  <path d="M 973 332 L 757 332" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r-ar-gray)"/>
  <!-- 9 box -->
  <rect x="600" y="348" width="310" height="34" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="755" y="370" fill="#1e40af" font-size="10" font-weight="bold" text-anchor="middle">9. manifest 타겟 ↔ HW ID 대조</text>
  <!-- 10 -->
  <text x="865" y="406" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">10. 0x27 SecurityAccess (세션 게이트)</text>
  <path d="M 757 414 L 973 414" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#r-ar-amber)"/>
  <!-- 11 -->
  <text x="865" y="434" fill="#334155" font-size="10" font-weight="bold" text-anchor="middle">11. 플래시 (UDS 0x34/0x36/0x37 · 평문)</text>
  <path d="M 757 442 L 973 442" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#r-ar-amber)"/>
  <!-- 12 -->
  <text x="865" y="462" fill="#64748b" font-size="9.5" text-anchor="middle">12. 결과</text>
  <path d="M 973 470 L 757 470" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#r-ar-gray)"/>
  <!-- 13 box -->
  <rect x="640" y="484" width="230" height="34" rx="5" fill="#dcfce7" stroke="#22c55e"/>
  <text x="755" y="506" fill="#166534" font-size="10" font-weight="bold" text-anchor="middle">13. 원자적 커밋 · 활성화</text>
  <!-- 14 -->
  <text x="430" y="534" fill="#166534" font-size="10" font-weight="bold" text-anchor="middle">14. 상태 보고 (INSTALL_COMPLETE) — eSync Client 경유</text>
  <path d="M 753 540 L 117 540" stroke="#22c55e" stroke-width="1.8" marker-end="url(#r-ar-green)"/>

  <defs>
    <marker id="r-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="r-ar-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
    <marker id="r-ar-amber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="r-ar-green" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker>
  </defs>
</svg>
