<svg viewBox="0 0 1240 752" width="1240" height="752" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- ===== DevOps ===== -->
  <rect x="24" y="112" width="96" height="40" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="72" y="130" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">내부</text>
  <text x="72" y="145" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">개발자</text>

  <rect x="140" y="66" width="360" height="132" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="156" y="86" fill="#334155" font-size="12" font-weight="bold">DevOps</text>
  <rect x="155" y="98" width="100" height="56" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="205" y="121" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">SVN</text>
  <text x="205" y="138" fill="#64748b" font-size="9.5" text-anchor="middle">(ALM)</text>
  <rect x="270" y="98" width="100" height="56" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="320" y="121" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">Jenkins</text>
  <text x="320" y="138" fill="#64748b" font-size="9.5" text-anchor="middle">(Build)</text>
  <rect x="385" y="98" width="100" height="56" rx="5" fill="#ffffff" stroke="#64748b"/>
  <text x="435" y="121" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">GPDM</text>
  <text x="435" y="138" fill="#64748b" font-size="9.5" text-anchor="middle">(PLM)</text>
  <path d="M 255 126 L 269 126" stroke="#334155" stroke-width="1.5" marker-end="url(#w-ar)"/>
  <path d="M 370 126 L 384 126" stroke="#334155" stroke-width="1.5" marker-end="url(#w-ar)"/>
  <path d="M 120 132 L 154 130" stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#w-ar)"/>

  <!-- GPDM -> eSync Server -->
  <path d="M 485 128 L 519 140" stroke="#334155" stroke-width="1.8" fill="none" marker-end="url(#w-ar)"/>
  <text x="500" y="119" fill="#64748b" font-size="9" text-anchor="middle">업로드</text>

  <!-- ===== eSync Server ===== -->
  <rect x="520" y="70" width="390" height="338" rx="8" fill="#ffffff" stroke="#334155"/>
  <rect x="520" y="70" width="390" height="28" rx="8" fill="#1e293b"/>
  <text x="715" y="89" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">eSync Server</text>

  <!-- Component -->
  <rect x="542" y="110" width="212" height="214" rx="6" fill="#fde7e7" stroke="#ef9a9a"/>
  <text x="648" y="130" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">eSync Component</text>
  <rect x="556" y="140" width="184" height="66" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="648" y="159" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">ZIP Component</text>
  <text x="566" y="178" fill="#334155" font-size="10">├ manifest.xml</text>
  <text x="566" y="196" fill="#334155" font-size="10">└ binary</text>
  <rect x="556" y="214" width="184" height="34" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <text x="648" y="235" fill="#334155" font-size="10.5" text-anchor="middle">Signature</text>
  <rect x="556" y="256" width="184" height="56" rx="4" fill="#ffffff" stroke="#ef9a9a"/>
  <g transform="translate(568,266)"><rect x="0" y="0" width="26" height="34" rx="2" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/><line x1="5" y1="9" x2="21" y2="9" stroke="#f59e0b" stroke-width="1.6"/><line x1="5" y1="16" x2="21" y2="16" stroke="#f59e0b" stroke-width="1.6"/><line x1="5" y1="23" x2="15" y2="23" stroke="#f59e0b" stroke-width="1.6"/><circle cx="21" cy="30" r="5" fill="#f59e0b"/></g>
  <text x="668" y="280" fill="#334155" font-size="10.5" font-weight="bold" text-anchor="middle">CS Cert</text>
  <text x="668" y="298" fill="#64748b" font-size="9" text-anchor="middle">(동봉)</text>

  <!-- Signing pipeline -->
  <rect x="785" y="118" width="104" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="837" y="143" fill="#334155" font-size="10.5" text-anchor="middle">Hash (SHA-256)</text>
  <rect x="785" y="172" width="104" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="837" y="197" fill="#334155" font-size="10.5" text-anchor="middle">Digest</text>
  <rect x="785" y="226" width="104" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="837" y="251" fill="#334155" font-size="10.5" text-anchor="middle">Sign (ECDSA)</text>
  <rect x="785" y="280" width="104" height="40" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="837" y="305" fill="#1e40af" font-size="10.5" font-weight="bold" text-anchor="middle">Signature</text>
  <path d="M 837 158 L 837 171" stroke="#334155" stroke-width="1.6" marker-end="url(#w-ar)"/>
  <path d="M 837 212 L 837 225" stroke="#334155" stroke-width="1.6" marker-end="url(#w-ar)"/>
  <path d="M 837 266 L 837 279" stroke="#334155" stroke-width="1.6" marker-end="url(#w-ar)"/>
  <path d="M 740 168 L 784 140" stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#w-ar)"/>
  <text x="742" y="128" fill="#64748b" font-size="9">Component 전체</text>
  <path d="M 785 300 L 742 236" stroke="#3b82f6" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#w-ar-blue)"/>
  <text x="700" y="330" fill="#3b82f6" font-size="9">부착</text>

  <!-- KMS (별도 시스템 · eSync Server 밖) -->
  <rect x="950" y="206" width="150" height="94" rx="6" fill="#fce7f3" stroke="#db2777"/>
  <text x="1025" y="230" fill="#9d174d" font-size="12" font-weight="bold" text-anchor="middle">KMS</text>
  <text x="1025" y="249" fill="#334155" font-size="9.5" text-anchor="middle">서명 리프 개인키</text>
  <text x="1025" y="265" fill="#334155" font-size="9.5" text-anchor="middle">(P-256)</text>
  <text x="1025" y="285" fill="#9d174d" font-size="9" text-anchor="middle">(별도 시스템)</text>
  <path d="M 948 246 L 891 246" stroke="#db2777" stroke-width="1.8" fill="none" marker-end="url(#w-ar-pink)"/>
  <text x="920" y="240" fill="#9d174d" font-size="9" text-anchor="middle">서명 요청·반환</text>

  <!-- Package -->
  <rect x="542" y="336" width="340" height="60" rx="6" fill="#fde7e7" stroke="#ef9a9a"/>
  <text x="712" y="360" fill="#b91c1c" font-size="12" font-weight="bold" text-anchor="middle">eSync Package</text>
  <text x="712" y="380" fill="#334155" font-size="9.5" text-anchor="middle">{ Component · componentRules · atomicRollback }</text>

  <!-- ===== Air Interface (mTLS) ===== -->
  <line x1="12" y1="430" x2="1228" y2="430" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="8" y="434" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>
  <text x="1232" y="434" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>
  <path d="M 600 396 L 600 414 L 250 414 L 250 484" stroke="#0ea5e9" stroke-width="2.2" fill="none" marker-end="url(#w-ar-blue)"/>
  <text x="300" y="408" fill="#0369a1" font-size="11" font-weight="bold">mTLS</text>
  <text x="1140" y="424" fill="#64748b" font-size="10" font-weight="bold">Air Interface</text>

  <!-- ===== TGU ===== -->
  <rect x="120" y="484" width="560" height="256" rx="8" fill="#ecfdf5" stroke="#34d399"/>
  <text x="136" y="506" fill="#047857" font-size="12.5" font-weight="bold">TGU (Telematics Gateway Unit)</text>
  <rect x="150" y="518" width="200" height="60" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="250" y="553" fill="#0369a1" font-size="12" font-weight="bold" text-anchor="middle">eSync Client</text>
  <rect x="430" y="518" width="200" height="60" rx="6" fill="#3b82f6"/>
  <text x="530" y="553" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">eSync Agent</text>
  <path d="M 352 548 L 428 548" stroke="#334155" stroke-width="1.8" marker-end="url(#w-ar)"/>
  <text x="390" y="541" fill="#64748b" font-size="9" text-anchor="middle">IPC</text>

  <rect x="150" y="596" width="480" height="108" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="164" y="616" fill="#047857" font-size="10.5" font-weight="bold">eSync Agent 처리 (EPOS 대신 무결성 검증):</text>
  <text x="164" y="640" fill="#334155" font-size="10.5">① 서명 검증: Root 신뢰앵커 → CS Cert 체인 → ECDSA 검증 → Component 재해시 비교</text>
  <text x="164" y="664" fill="#334155" font-size="10.5">② 호환성: manifest 타겟 + HW ID(UDS 0x22) 대조</text>
  <text x="164" y="688" fill="#334155" font-size="10.5">③ 플래시: 0x27 SecurityAccess 게이트 → 평문 플래시 (0x29 미사용)</text>

  <!-- ===== EPOS-10i ===== -->
  <rect x="720" y="484" width="400" height="256" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="736" y="506" fill="#1e3a8a" font-size="12.5" font-weight="bold">EPOS-10i</text>
  <rect x="750" y="522" width="340" height="50" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="920" y="552" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">OSEK (Single Bank)</text>
  <text x="736" y="602" fill="#334155" font-size="10.5">• HSM 없음 · 전자서명 검증/암복호화 불가</text>
  <text x="736" y="626" fill="#334155" font-size="10.5">• 무결성 검증은 TGU가 대행</text>
  <text x="736" y="650" fill="#334155" font-size="10.5">• 평문 페이로드 수용</text>
  <text x="736" y="674" fill="#334155" font-size="10.5">• 복구: Insurance Kernel + 원자적 커밋 (A/B 뱅크 없음)</text>

  <path d="M 632 548 L 718 548" stroke="#f59e0b" stroke-width="2.2" fill="none" marker-end="url(#w-ar-amber)"/>
  <text x="675" y="540" fill="#b45309" font-size="9.5" text-anchor="middle">UDS on CAN</text>

  <defs>
    <marker id="w-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker>
    <marker id="w-ar-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="w-ar-pink" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#db2777"/></marker>
    <marker id="w-ar-amber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
