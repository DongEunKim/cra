<svg viewBox="0 0 920 820" width="920" height="820" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">

  <!-- ============ 밴드 ① 클라우드 ============ -->
  <rect x="20" y="20" width="880" height="252" rx="8" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="34" y="42" fill="#1e3a8a" font-size="13" font-weight="bold">① 클라우드 — OTA 플랫폼 · 백엔드</text>
  <text x="300" y="56" fill="#64748b" font-size="9.5">비즈니스 · 운영 프론트엔드 (플랫폼을 쓰는 상위 시스템)</text>

  <!-- GPDM 소스 어댑터 -->
  <rect x="45" y="62" width="235" height="40" rx="5" fill="#f1f5f9" stroke="#64748b"/>
  <text x="162" y="80" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">GPDM</text>
  <text x="162" y="95" fill="#64748b" font-size="9" text-anchor="middle">Component · SW BOM 소스 (원장)</text>
  <path d="M 280 86 C 300 96, 300 120, 300 146" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>

  <!-- 프론트엔드 2종 -->
  <rect x="360" y="62" width="272" height="40" rx="5" fill="#f1f5f9" stroke="#64748b"/>
  <text x="496" y="80" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">OTA 운영 플랫폼 (PS) · 운영 콘솔</text>
  <text x="496" y="95" fill="#64748b" font-size="9" text-anchor="middle">eSync Operator UI · 딜러/AS 부분 개방(RBAC)</text>

  <rect x="660" y="62" width="180" height="40" rx="5" fill="#f1f5f9" stroke="#64748b"/>
  <text x="750" y="80" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">FMS</text>
  <text x="750" y="95" fill="#64748b" font-size="9" text-anchor="middle">플릿 관리</text>

  <!-- 프론트엔드 → 코어 (API) -->
  <path d="M 496 102 L 496 139" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
  <path d="M 750 102 L 750 139" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
  <text x="548" y="120" fill="#64748b" font-size="9">API · 어댑터</text>

  <!-- OTA 플랫폼 코어 -->
  <rect x="300" y="140" width="575" height="118" rx="6" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="587" y="163" fill="#1e3a8a" font-size="12.5" font-weight="bold" text-anchor="middle">eSync Server · 백엔드</text>
  <rect x="312" y="176" width="128" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="376" y="206" fill="#334155" font-size="10.5" text-anchor="middle">캠페인</text>
  <text x="376" y="222" fill="#334155" font-size="10.5" text-anchor="middle">타겟팅</text>
  <rect x="453" y="176" width="128" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="517" y="206" fill="#334155" font-size="10.5" text-anchor="middle">패키지·컴포넌트</text>
  <text x="517" y="222" fill="#334155" font-size="10.5" text-anchor="middle">DB</text>
  <rect x="594" y="176" width="128" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="658" y="206" fill="#334155" font-size="10.5" text-anchor="middle">중앙집중</text>
  <text x="658" y="222" fill="#334155" font-size="10.5" text-anchor="middle">서명(요청)</text>
  <rect x="735" y="176" width="128" height="68" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="799" y="206" fill="#334155" font-size="10.5" text-anchor="middle">감사·SBOM</text>
  <text x="799" y="222" fill="#334155" font-size="10.5" text-anchor="middle">추적성</text>

  <!-- KMS/CA (격리 백엔드) -->
  <rect x="45" y="140" width="200" height="64" rx="6" fill="#ccfbf1" stroke="#0d9488"/>
  <text x="145" y="162" fill="#0f766e" font-size="12.5" font-weight="bold" text-anchor="middle">KMS · CA 계층</text>
  <text x="145" y="181" fill="#334155" font-size="10" text-anchor="middle">Root CA · Dev-IC · CS-IC</text>
  <text x="145" y="197" fill="#64748b" font-size="9.5" text-anchor="middle">격리 · 서명 권한</text>

  <!-- VLM (차량 신원 서비스) -->
  <rect x="45" y="212" width="200" height="44" rx="6" fill="#f1f5f9" stroke="#64748b"/>
  <text x="145" y="232" fill="#334155" font-size="11" font-weight="bold" text-anchor="middle">차량 신원 서비스 (VLM)</text>
  <text x="145" y="248" fill="#64748b" font-size="9" text-anchor="middle">식별자↔VIN · SBOM 이력</text>

  <!-- 코어 → KMS (서명 요청) -->
  <path d="M 298 172 L 247 172" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#a-teal)"/>
  <text x="272" y="166" fill="#0f766e" font-size="9" text-anchor="middle">서명</text>
  <text x="272" y="187" fill="#0f766e" font-size="9" text-anchor="middle">요청</text>
  <!-- VLM → 코어 (신원 제공) -->
  <path d="M 247 234 L 298 234" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a-gray)"/>
  <text x="272" y="228" fill="#64748b" font-size="8.5" text-anchor="middle">신원</text>

  <!-- 밴드①→② 흐름 -->
  <path d="M 400 258 L 400 335" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- ==== Air Interface 구분선 1 ==== -->
  <line x1="12" y1="286" x2="908" y2="286" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="8" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>
  <text x="912" y="290" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>
  <text x="852" y="281" fill="#64748b" font-size="10" font-weight="bold">Air Interface</text>

  <!-- ============ 밴드 ② 통신 ============ -->
  <rect x="20" y="300" width="880" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="34" y="322" fill="#0369a1" font-size="13" font-weight="bold">② 통신 — Air Interface</text>

  <!-- eSync Messaging Protocol (주) -->
  <rect x="45" y="334" width="610" height="46" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="350" y="362" fill="#1e40af" font-size="12" font-weight="bold" text-anchor="middle">eSync Messaging Protocol   ·   제어 · 메타데이터</text>
  <!-- 전송 (부) -->
  <rect x="80" y="388" width="540" height="30" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="350" y="408" fill="#334155" font-size="10" text-anchor="middle">전송 : AWS IoT Core (MQTT / mTLS · 5G) — 교체 가능 · 별도 팀 소관 (TBD)</text>

  <!-- 펌웨어 파일 서버 -->
  <rect x="678" y="334" width="197" height="102" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="776" y="360" fill="#0369a1" font-size="11.5" font-weight="bold" text-anchor="middle">펌웨어 파일 서버 (HTTPS)</text>
  <text x="776" y="383" fill="#334155" font-size="10" text-anchor="middle">펌웨어 bulk · 아웃오브밴드</text>
  <text x="776" y="401" fill="#64748b" font-size="9.5" text-anchor="middle">(통신 채널은 주소만 전달,</text>
  <text x="776" y="415" fill="#64748b" font-size="9.5" text-anchor="middle">기기가 직접 다운로드)</text>

  <!-- 밴드②→③ 흐름 -->
  <path d="M 400 418 L 400 517" stroke="#3b82f6" stroke-width="2.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- ==== Air Interface 구분선 2 ==== -->
  <line x1="12" y1="464" x2="908" y2="464" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="8" y="468" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>
  <text x="912" y="468" fill="#94a3b8" font-size="12" text-anchor="middle">✕</text>

  <!-- ============ 밴드 ③ 장비 ============ -->
  <rect x="20" y="478" width="880" height="326" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="34" y="500" fill="#15803d" font-size="13" font-weight="bold">③ 장비 — 기계 내부 제어기</text>

  <!-- TGU -->
  <rect x="45" y="518" width="565" height="104" rx="6" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="327" y="542" fill="#0369a1" font-size="13" font-weight="bold" text-anchor="middle">eSync Client  +  모든 eSync Agent (동거)</text>
  <text x="327" y="564" fill="#334155" font-size="10.5" text-anchor="middle">Comm Mgr · Orchestrator · Message Broker · 정책 · 상태</text>
  <text x="327" y="584" fill="#334155" font-size="10.5" text-anchor="middle">Agent 핸들러 :  uds-can · linux · android</text>
  <text x="327" y="608" fill="#0f766e" font-size="10.5" font-weight="bold" text-anchor="middle">eSync 전송 신뢰경계 = 여기까지 (플랫폼 서명 검증)</text>

  <!-- SGW -->
  <rect x="640" y="518" width="180" height="64" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="730" y="544" fill="#0f766e" font-size="12.5" font-weight="bold" text-anchor="middle">SGW (진단 경계)</text>
  <text x="730" y="566" fill="#64748b" font-size="10" text-anchor="middle">eSync 밖 · 유선 후보</text>

  <!-- DMS -->
  <rect x="640" y="624" width="180" height="44" rx="6" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="730" y="652" fill="#6b21a8" font-size="12" font-weight="bold" text-anchor="middle">DMS 진단툴</text>
  <path d="M 730 622 L 730 584" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#a-purple)"/>
  <text x="762" y="606" fill="#6b21a8" font-size="9.5">OBD-II</text>

  <!-- 이더넷 제어기 -->
  <rect x="70" y="676" width="245" height="100" rx="6" fill="#ffffff" stroke="#64748b"/>
  <text x="192" y="700" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">이더넷 제어기 (Linux / Android)</text>
  <text x="192" y="720" fill="#64748b" font-size="10" text-anchor="middle">SAVM · PHM · XCU · GP</text>
  <text x="192" y="740" fill="#0369a1" font-size="10" text-anchor="middle">부팅 시 독립 재검증</text>
  <text x="192" y="757" fill="#64748b" font-size="9.5" text-anchor="middle">(Verified Boot · dm-verity · APK 서명)</text>

  <!-- CAN RTOS ECU -->
  <rect x="355" y="676" width="255" height="100" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="482" y="700" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">CAN RTOS ECU</text>
  <text x="482" y="720" fill="#b45309" font-size="10" text-anchor="middle">EPOS (HSM) · 비-HSM ECU</text>
  <text x="482" y="740" fill="#b45309" font-size="10" text-anchor="middle">UDS 0x29 · 부품 정품 인증서</text>
  <text x="482" y="757" fill="#b45309" font-size="9.5" text-anchor="middle">부팅 시 secure boot 재검증</text>

  <!-- TGU → 이더넷 -->
  <path d="M 192 622 L 192 675" stroke="#0ea5e9" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <text x="200" y="652" fill="#0369a1" font-size="9.5">이더넷 (TLS / DoIP)</text>
  <!-- TGU → CAN -->
  <path d="M 482 622 L 482 675" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#a-amber)"/>
  <text x="490" y="652" fill="#b45309" font-size="9.5">CAN (UDS over CAN)</text>

  <!-- 하단 노트 -->
  <text x="34" y="796" fill="#64748b" font-size="9.5">↑ TGU↔타겟 구간 = eSync 신뢰경계 밖 → 우리 device PKI(Dev-IC 부품 정품 인증서 · UDS 0x29) + 타겟 부팅 시 독립 재검증이 담당</text>

  <defs>
    <marker id="a-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0ea5e9"/></marker>
    <marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#0d9488"/></marker>
    <marker id="a-purple" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/></marker>
    <marker id="a-amber" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
